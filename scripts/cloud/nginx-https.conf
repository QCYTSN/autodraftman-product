server {
    listen 443 ssl;
    server_name 34.143.155.158;
    ssl_certificate /etc/letsencrypt/live/figfox-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/figfox-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/figfox-cloud;
    client_max_body_size 22m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location /api/ { return 404; }
    location /local-api { return 404; }
    location /data/ { return 404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
