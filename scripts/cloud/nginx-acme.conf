# Certificate validation only. Never proxy an API over plaintext HTTP.
server {
    listen 80;
    server_name 34.143.155.158;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/figfox-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
