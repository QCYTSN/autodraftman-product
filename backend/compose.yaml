services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: autodraftman
      POSTGRES_USER: autodraftman
      POSTGRES_PASSWORD: autodraftman
    ports:
      - "5432:5432"
    volumes:
      - autodraftman_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autodraftman -d autodraftman"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: autodraftman
      MINIO_ROOT_PASSWORD: autodraftman-local-only
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - autodraftman_minio_data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 autodraftman autodraftman-local-only; do sleep 1; done
        mc mb --ignore-existing local/autodraftman
        mc anonymous set none local/autodraftman
  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      AUTODRAFTMAN_DATABASE_URL: postgresql+asyncpg://autodraftman:autodraftman@postgres:5432/autodraftman
      AUTODRAFTMAN_S3_ENDPOINT_URL: http://minio:9000
      AUTODRAFTMAN_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      AUTODRAFTMAN_S3_REGION: us-east-1
      AUTODRAFTMAN_S3_BUCKET: autodraftman
      AUTODRAFTMAN_S3_ACCESS_KEY_ID: autodraftman
      AUTODRAFTMAN_S3_SECRET_ACCESS_KEY: autodraftman-local-only
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && uvicorn autodraftman_backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  autodraftman_pgdata:
  autodraftman_minio_data:
