  <title>Previous category-specific paradigm and category-unified paradigm comparison</title>
  <desc>
    Two-row academic diagram. Top row: previous category-specific paradigm with four category icons, four separate model boxes, dense point-to-point template/search-region interaction, and global-pooled/point-wise localization with feature points, score boxes, arrows and a bounding-box point cloud. Bottom row: category-unified paradigm with category icons feeding one unified model, adaptive keypoint sparse alignment, and structure-aware localization with keypoint graph and bounding box. SAM picture assets map category icons only; all diagrams, text, frames, arrows and point-cloud details are constructed in native SVG and then confirmed icon assets are overlaid at their original source crop positions.
  </desc>

  <title>Previous category-specific paradigm and category-unified paradigm comparison</title>
  <desc>
    Two-row academic diagram. Top row: previous category-specific paradigm with four category icons, four separate model boxes, dense point-to-point template/search-region interaction, and global-pooled/point-wise localization with feature points, score boxes, arrows and a bounding-box point cloud. Bottom row: category-unified paradigm with category icons feeding one unified model, adaptive keypoint sparse alignment, and structure-aware localization with keypoint graph and bounding box. SAM picture assets map category icons only; all diagrams, text, frames, arrows and point-cloud details are constructed in native SVG and then confirmed icon assets are overlaid at their original source crop positions.
  </desc>

  <title>Previous category-specific paradigm and category-unified paradigm comparison</title>
  <desc>
    Two-row academic diagram. Top row: previous category-specific paradigm with four category icons, four separate model boxes, dense point-to-point template/search-region interaction, and global-pooled/point-wise localization with feature points, score boxes, arrows and a bounding-box point cloud. Bottom row: category-unified paradigm with category icons feeding one unified model, adaptive keypoint sparse alignment, and structure-aware localization with keypoint graph and bounding box. SAM picture assets map category icons only; all diagrams, text, frames, arrows and point-cloud details are constructed in native SVG and then confirmed icon assets are overlaid at their original source crop positions.
  </desc>

  <title>Previous category-specific paradigm and category-unified paradigm comparison</title>
  <desc>
    Two-row academic diagram. Top row: previous category-specific paradigm with four category icons, four separate model boxes, dense point-to-point template/search-region interaction, and global-pooled/point-wise localization with feature points, score boxes, arrows and a bounding-box point cloud. Bottom row: category-unified paradigm with category icons feeding one unified model, adaptive keypoint sparse alignment, and structure-aware localization with keypoint graph and bounding box. SAM picture assets map category icons only; all diagrams, text, frames, arrows and point-cloud details are constructed in native SVG and then confirmed icon assets are overlaid at their original source crop positions.
  </desc>
