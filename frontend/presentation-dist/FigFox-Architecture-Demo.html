  <title>Train and inference pipelines with hash table and prototype bank update</title>
  <desc>
    Figure contains two side-by-side method diagrams separated by a heavy vertical divider. Left block has Train over Inference: a bird image feeds an Image Encoder and Hash Head to a Hash Table, with a downward update to a New hash table; inference uses four example image thumbnails through a frozen encoder and hash head to the new table. Right block has Train over TTA Inference: a bird image feeds Image Encoder, Projector, and Prototype Bank; lower TTA inference uses four thumbnails through frozen encoder/projector to a prototype bank, with update arrows, timer icon, and red T1 annotation. Symmetry basis: top and bottom rows are vertically paired in each half; left and right halves mirror the train/inference structure while differing in terminal memory object.
  </desc>

  <title>Train and inference pipelines with hash table and prototype bank update</title>
  <desc>
    Figure contains two side-by-side method diagrams separated by a heavy vertical divider. Left block has Train over Inference: a bird image feeds an Image Encoder and Hash Head to a Hash Table, with a downward update to a New hash table; inference uses four example image thumbnails through a frozen encoder and hash head to the new table. Right block has Train over TTA Inference: a bird image feeds Image Encoder, Projector, and Prototype Bank; lower TTA inference uses four thumbnails through frozen encoder/projector to a prototype bank, with update arrows, timer icon, and red T1 annotation. Symmetry basis: top and bottom rows are vertically paired in each half; left and right halves mirror the train/inference structure while differing in terminal memory object.
  </desc>

  <title>Train and inference pipelines with hash table and prototype bank update</title>
  <desc>
    Figure contains two side-by-side method diagrams separated by a heavy vertical divider. Left block has Train over Inference: a bird image feeds an Image Encoder and Hash Head to a Hash Table, with a downward update to a New hash table; inference uses four example image thumbnails through a frozen encoder and hash head to the new table. Right block has Train over TTA Inference: a bird image feeds Image Encoder, Projector, and Prototype Bank; lower TTA inference uses four thumbnails through frozen encoder/projector to a prototype bank, with update arrows, timer icon, and red T1 annotation. Symmetry basis: top and bottom rows are vertically paired in each half; left and right halves mirror the train/inference structure while differing in terminal memory object.
  </desc>

  <title>Train and inference pipelines with hash table and prototype bank update</title>
  <desc>
    Figure contains two side-by-side method diagrams separated by a heavy vertical divider. Left block has Train over Inference: a bird image feeds an Image Encoder and Hash Head to a Hash Table, with a downward update to a New hash table; inference uses four example image thumbnails through a frozen encoder and hash head to the new table. Right block has Train over TTA Inference: a bird image feeds Image Encoder, Projector, and Prototype Bank; lower TTA inference uses four thumbnails through frozen encoder/projector to a prototype bank, with update arrows, timer icon, and red T1 annotation. Symmetry basis: top and bottom rows are vertically paired in each half; left and right halves mirror the train/inference structure while differing in terminal memory object.
  </desc>
