  <title id="logo-title">FigFox — editable vector logo</title>
  <desc id="logo-description">Editable reconstruction of the supplied final logo: a purple tail, deep purple border and recessed edge, one orange sweep and two separate white sweeps. All artwork is made of cubic Bézier paths and editable SVG gradients. No embedded bitmap.</desc>
