    <line id="slash_host2_top_cache" x1="364" y1="23" x2="295" y2="92" stroke="#000000" stroke-width="1.4" />
    <text id="txt_host2_top_c1" class="smallText" x="325" y="59">C1</text>
    <text id="txt_host2_top_c2" class="smallText" x="376" y="59">C2</text>
    <text id="txt_host2_kvcache" class="kvText" x="354" y="103">KV-Cache</text>
  </g>

  
  <g id="host3_top_kvcache">
    <rect id="f04_host3_top_c1_dash" data-plus-kind="frame" x="546" y="35" width="51" height="46" rx="7" ry="7" fill="#ffffff" stroke="#6d95d8" stroke-width="1.4" stroke-dasharray="5 4" />
