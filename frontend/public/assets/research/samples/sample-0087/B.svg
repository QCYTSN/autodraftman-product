<svg xmlns="http://www.w3.org/2000/svg" width="753" height="819" viewBox="0 0 753 819">
  <title>KV-cache anchoring and context distribution across three hosts</title>
  <desc>
    Inventory: three vertically aligned host sections with top KV-Cache blocks, black upward arrows, rounded host containers containing Layer 1, Layer 2, ellipsis, and Layer N; lower anchor/cache blocks under each host; a three-token Context row at the bottom with braces and colored/dashed arrows to anchors; dashed Query box at lower right. Layout is columnar and horizontally symmetric around the three host centers, with C1/C2/C3 color coding and diagonal slash marks on combined KV-cache blocks.
  </desc>

  <defs>
    <marker id="arrowBlack" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000000" id="plus_node_0" />
    </marker>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#6d91cc" id="plus_node_1" />
    </marker>
    <marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#e6a000" id="plus_node_2" />
    </marker>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#6cab58" id="plus_node_3" />
    </marker>

    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill:#000; text-anchor:middle; dominant-baseline:middle; }
      .cacheText { font-family: Arial, Helvetica, sans-serif; font-size:22px; fill:#000; text-anchor:middle; dominant-baseline:middle; }
      .smallText { font-family: Arial, Helvetica, sans-serif; font-size:23px; fill:#000; text-anchor:middle; dominant-baseline:middle; }
      .layerText { font-family: Arial, Helvetica, sans-serif; font-size:23px; fill:#000; text-anchor:middle; dominant-baseline:middle; }
      .hostText { font-family: Arial, Helvetica, sans-serif; font-size:23px; fill:#000; text-anchor:middle; dominant-baseline:middle; }
      .kvText { font-family: Arial, Helvetica, sans-serif; font-size:22px; fill:#000; text-anchor:middle; dominant-baseline:middle; }
      .blueStroke { stroke:#6d95d8; }
      .orangeStroke { stroke:#e59b00; }
      .greenStroke { stroke:#75ad69; }
    </style>
  </defs>

  <rect id="f00_canvas" data-plus-kind="frame" x="0" y="0" width="753" height="819" fill="#ffffff" stroke="none" />

  
  <g id="arrows_black_vertical">
    <line id="arrow_top_host1" x1="105" y1="166" x2="105" y2="124" stroke="#000" stroke-width="1.6" marker-end="url(#arrowBlack)" />
    <line id="arrow_top_host2" x1="354" y1="166" x2="354" y2="124" stroke="#000" stroke-width="1.6" marker-end="url(#arrowBlack)" />
    <line id="arrow_top_host3" x1="588" y1="166" x2="588" y2="124" stroke="#000" stroke-width="1.6" marker-end="url(#arrowBlack)" />

    <line id="arrow_lower_host1" x1="104" y1="486" x2="104" y2="444" stroke="#000" stroke-width="1.6" marker-end="url(#arrowBlack)" />
    <line id="arrow_lower_host2" x1="354" y1="486" x2="354" y2="444" stroke="#000" stroke-width="1.6" marker-end="url(#arrowBlack)" />
    <line id="arrow_lower_host3" x1="588" y1="486" x2="588" y2="444" stroke="#000" stroke-width="1.6" marker-end="url(#arrowBlack)" />
  </g>

