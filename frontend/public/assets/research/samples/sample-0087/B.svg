" ry="7" fill="none" stroke="#6d95d8" stroke-width="1.4" stroke-dasharray="5 4" /><rect id="f22_host3_anchor_c3" data-plus-kind="frame" x="585" y="500" width="82" height="52" rx="7" ry="7" fill="#dcefd8" stroke="#75ad69" stroke-width="1.5" /><text id="txt_host3_anchor_c1" class="smallText" x="545" y="526">C1</text><text id="txt_host3_anchor_c3" class="smallText" x="626" y="526">C3</text><text id="txt_host3_anchor_label" class="hostText" x="546" y="576">Anchor</text></g><g id="context_braces" fill="none" stroke="#a8a8a8" stroke-width="1.6" stroke-linecap="round">
