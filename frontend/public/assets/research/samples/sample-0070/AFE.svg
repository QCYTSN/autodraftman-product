  <text x="2320" y="500" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 2320 500)" class="sans moduleText" fill="#ff8b63">Conv</text>
  <text x="2432" y="500" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 2432 500)" class="sans moduleText" fill="#d69bf2">ReLU</text>
  <text x="2544" y="500" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 2544 500)" class="sans moduleText" fill="#76bf4f">AvgPooling</text>
