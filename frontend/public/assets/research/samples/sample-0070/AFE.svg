  <line x1="3264" y1="497" x2="3288" y2="497" class="line"/>
  <line x1="3424" y1="497" x2="3560" y2="497" class="line" marker-end="url(#arrow)"/>
  <line x1="3220" y1="653" x2="3220" y2="914" class="line" marker-end="url(#arrow)"/>

  <!-- output -->
  <text x="3646" y="486" text-anchor="middle" class="sans label bold">Output</text>
  <text x="3615" y="541" class="serif math bold">E[Y<tspan baseline-shift="super" font-size="27">2</tspan>]</text>

  <!-- bottom annotations -->
  <text x="665" y="988" text-anchor="middle" class="sans label">Creating noisy samples</text>
  <text x="315" y="1050" class="serif math italic">X<tspan baseline-shift="sub" font-size="27">i,j</tspan> = Dropout(X′<tspan baseline-shift="sub" font-size="27">i</tspan>), j = 1,2, ... , n,</text>
  <text x="538" y="1111" class="serif math italic">X ∈ ℝ<tspan baseline-shift="super" font-size="27">B×N×F</tspan></text>

  <text x="1210" y="1038" class="serif math italic">L = αED<tspan baseline-shift="sub" font-size="27">c</tspan> − (1 − α)ED<tspan baseline-shift="sub" font-size="27">d</tspan></text>

  <path d="M1768 944 L1768 1115 M1768 944 L1786 944 M1768 1030 L1752 1030 M1768 1115 L1786 1115" fill="none" stroke="#000" stroke-width="4"/>
  <text x="1801" y="968" class="serif math">ED<tspan baseline-shift="sub" font-size="27">c</tspan> = <tspan font-size="34">1</tspan>/<tspan font-size="34">B</tspan>Σ<tspan baseline-shift="sub" font-size="27">i</tspan> ED<tspan class="italic"> (X<tspan baseline-shift="sub" font-size="27">i</tspan><tspan baseline-shift="super" font-size="27">(l)</tspan>)</tspan></text>
  <text x="1801" y="1128" class="serif math">ED<tspan baseline-shift="sub" font-size="27">d</tspan> = ED<tspan class="italic">(E[X<tspan baseline-shift="super" font-size="27">(l)</tspan>])</tspan></text>

  <text x="2285" y="1042" class="serif math">ED<tspan class="italic">(X)</tspan> = </text>
  <text x="2483" y="1011" class="serif smallmath">tr<tspan class="italic">(E[XX<tspan baseline-shift="super" font-size="24">T</tspan>])</tspan><tspan baseline-shift="super" font-size="24">2</tspan></text>
  <line x1="2475" y1="1030" x2="2716" y2="1030" stroke="#000" stroke-width="3"/>
  <text x="2468" y="1075" class="serif smallmath">‖<tspan class="italic">E[XX<tspan baseline-shift="super" font-size="24">T</tspan>]</tspan>‖<tspan baseline-shift="super" font-size="24">2</tspan><tspan baseline-shift="sub" font-size="24">F</tspan></text>

  <text x="3220" y="995" text-anchor="middle" class="sans label">Regularization</text>
