  <line x1="2774" y1="735" x2="2774" y2="796" class="line"/>
  <line x1="2774" y1="796" x2="2656" y2="796" class="line" marker-end="url(#arrow)"/>
  <rect x="2481" y="750" width="164" height="93" fill="#fff" stroke="#7432a7" stroke-width="7"/>
  <text x="2563" y="815" text-anchor="middle" class="serif moduleText italic" fill="#7432a7">L<tspan baseline-shift="sub" font-size="27">dc</tspan></text>
  <line x1="2481" y1="796" x2="2377" y2="796" class="line"/>
  <line x1="2377" y1="796" x2="2377" y2="704" class="line" marker-end="url(#arrow)"/>

  <!-- Linear classifier -->
  <text x="3220" y="280" text-anchor="middle" class="sans title">Linear Classifier</text>
  <rect x="3019" y="306" width="405" height="390" class="outer"/>
  <rect x="3064" y="347" width="88" height="306" fill="#f5f5f5" stroke="#91b4ff" stroke-width="7"/>
  <rect x="3176" y="347" width="88" height="306" fill="#e7bd48" stroke="#e7bd48" stroke-width="7"/>
  <rect x="3288" y="347" width="88" height="306" fill="#f5f5f5" stroke="#ff6fa5" stroke-width="7"/>
  <text x="3108" y="500" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 3108 500)" class="sans moduleText" fill="#91b4ff">Flatten</text>
  <text x="3220" y="500" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 3220 500)" class="sans moduleText" fill="#c99b29">Dropout</text>
  <text x="3332" y="500" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 3332 500)" class="sans moduleText" fill="#ff6fa5">FC</text>
