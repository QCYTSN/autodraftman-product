  <text x="1595" y="280" text-anchor="middle" class="sans title">Conv2</text>
  <rect x="1340" y="306" width="515" height="390" class="outer"/>
  <rect x="1386" y="347" width="88" height="306" fill="#f5f5f5" stroke="#5fcbd0" stroke-width="7"/>
  <rect x="1498" y="347" width="88" height="306" fill="#f5f5f5" stroke="#ff8b63" stroke-width="7"/>
  <rect x="1610" y="347" width="88" height="306" fill="#f5f5f5" stroke="#d69bf2" stroke-width="7"/>
