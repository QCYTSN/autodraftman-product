  <path d="M2925 200 C2925 174 2928 166 2937 166 L3214 166 C3220 166 3221 133 3221 133 C3221 133 3223 166 3229 166 L3505 166 C3514 166 3517 174 3517 200" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
