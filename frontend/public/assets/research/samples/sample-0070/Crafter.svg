<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1695 528" width="1695" height="528">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111"/>
    </marker>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}
      .serif{font-family:Times New Roman,serif}
      .blk{stroke:#111;stroke-width:3;fill:none;stroke-linecap:square;stroke-linejoin:miter}
      .thin{stroke:#111;stroke-width:2;fill:none;stroke-linecap:square;stroke-linejoin:miter}
      .outer{fill:#e9e9e9;stroke:#777;stroke-width:4}
      .bn{fill:#f5fbfb;stroke:#5ec8cf;stroke-width:4}
      .drop{fill:#fbf8ee;stroke:#d4b840;stroke-width:3;stroke-dasharray:9 5}
      .conv{fill:#fff5f0;stroke:#f4936d;stroke-width:4}
      .relu{fill:#faf5fd;stroke:#c99ee3;stroke-width:4}
      .pool{fill:#f6fbf2;stroke:#82c458;stroke-width:4}
      .fc{fill:#fff4fa;stroke:#f48caf;stroke-width:4}
    </style>
  </defs>

  <rect x="0" y="0" width="1695" height="528" fill="#ffffff"/>

  <!-- top phase braces -->
  <path d="M204 91 L204 80 Q204 72 212 72 L747 72 Q756 72 756 62 Q756 72 765 72 L1300 72 Q1308 72 1308 80 L1308 91" fill="none" stroke="#111" stroke-width="2"/>
  <text x="756" y="47" text-anchor="middle" class="sans" font-size="20" fill="#111">Phase 1 training</text>

  <path d="M1318 91 L1318 80 Q1318 72 1326 72 L1444 72 Q1454 72 1454 62 Q1454 72 1464 72 L1583 72 Q1591 72 1591 80 L1591 91" fill="none" stroke="#111" stroke-width="2"/>
  <text x="1454" y="47" text-anchor="middle" class="sans" font-size="20" fill="#111">Phase 2 training</text>

  <!-- dotted phase containers -->
  <rect x="190" y="98" width="1128" height="294" rx="55" ry="55" fill="none" stroke="#888" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 8"/>
  <rect x="1326" y="98" width="267" height="294" rx="48" ry="48" fill="none" stroke="#888" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 8"/>

  <!-- Input -->
  <text x="61" y="216" class="sans" font-size="20" font-weight="700" fill="#111">Input</text>
  <text x="42" y="248" class="serif" font-size="20" font-style="italic" fill="#111">
    X′ ∈ ℝ<tspan baseline-shift="super" font-size="13">B×F</tspan>
  </text>
  <text x="42" y="281" class="serif" font-size="20" font-style="italic" fill="#111">F = c × h × w</text>
  <line x1="154" y1="231" x2="220" y2="231" class="blk" marker-end="url(#arrow)"/>

  <!-- Conv1 -->
  <text x="362" y="130" text-anchor="middle" class="sans" font-size="20" fill="#111">Conv1</text>
  <rect x="224" y="142" width="276" height="206" class="outer"/>
  <rect x="237" y="161" width="43" height="141" class="bn"/>
  <rect x="293" y="161" width="44" height="141" class="drop"/>
  <rect x="346" y="161" width="42" height="141" class="conv"/>
  <rect x="398" y="161" width="43" height="141" class="relu"/>
  <rect x="448" y="161" width="42" height="141" class="pool"/>
  <text x="259" y="232" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#56bfc6" transform="rotate(-90 259 232)">BatchNorm</text>
  <text x="315" y="232" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#c8ad33" transform="rotate(-90 315 232)">Dropout</text>
  <text x="367" y="232" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#ee8b67" transform="rotate(-90 367 232)">Conv</text>
  <text x="420" y="232" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#be8add" transform="rotate(-90 420 232)">ReLU</text>
  <text x="470" y="232" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#7abd52" transform="rotate(-90 470 232)">MaxPooling</text>
  <line x1="280" y1="231" x2="293" y2="231" class="thin" marker-end="url(#arrow)"/>
  <line x1="337" y1="231" x2="346" y2="231" class="thin" marker-end="url(#arrow)"/>
  <line x1="388" y1="231" x2="398" y2="231" class="thin" marker-end="url(#arrow)"/>
  <line x1="441" y1="231" x2="448" y2="231" class="thin" marker-end="url(#arrow)"/>

  <!-- Conv1 sampling / FOP / loss -->
  <line x1="315" y1="302" x2="315" y2="381" class="blk" marker-end="url(#arrow)"/>
  <line x1="500" y1="231" x2="552" y2="231" class="blk"/>
  <circle cx="558" cy="231" r="6.5" fill="#fff" stroke="#111" stroke-width="4"/>
  <line x1="565" y1="231" x2="623" y2="231" class="blk" marker-end="url(#arrow)"/>
  <line x1="558" y1="238" x2="558" y2="306" class="blk" marker-end="url(#arrow)"/>
  <rect x="529" y="306" width="62" height="43" fill="#fff" stroke="#8be3b1" stroke-width="3"/>
  <text x="560" y="333" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#72dca3">FOP</text>
  <rect x="443" y="340" width="82" height="38" fill="#fff" stroke="#5b2990" stroke-width="4"/>
  <text x="484" y="365" text-anchor="middle" class="serif" font-size="20" font-style="italic" fill="#5b2990">L<tspan baseline-shift="sub" font-size="13">dc</tspan></text>
  <path d="M560 349 L560 359 L525 359" class="blk" marker-end="url(#arrow)"/>
  <path d="M484 340 L484 324 L366 324 L366 307" class="blk" marker-end="url(#arrow)"/>

  <!-- Conv2 -->
  <text x="744" y="130" text-anchor="middle" class="sans" font-size="20" fill="#111">Conv2</text>
  <rect x="626" y="142" width="238" height="206" class="outer"/>
  <rect x="642" y="161" width="42" height="141" class="bn"/>
  <rect x="698" y="161" width="43" height="141" class="conv"/>
  <rect x="750" y="161" width="43" height="141" class="relu"/>
  <rect x="806" y="161" width="42" height="141" class="pool"/>
  <text x="663" y="232" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#56bfc6" transform="rotate(-90 663 232)">BatchNorm</text>
  <text x="720" y="232" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#ee8b67" transform="rotate(-90 720 232)">Conv</text>
  <text x="772" y="232" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#be8add" transform="rotate(-90 772 232)">ReLU</text>
  <text x="828" y="232" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#7abd52" transform="rotate(-90 828 232)">MaxPooling</text>
  <line x1="684" y1="231" x2="698" y2="231" class="thin" marker-end="url(#arrow)"/>
  <line x1="741" y1="231" x2="750" y2="231" class="thin" marker-end="url(#arrow)"/>
  <line x1="793" y1="231" x2="806" y2="231" class="thin" marker-end="url(#arrow)"/>

  <line x1="864" y1="231" x2="920" y2="231" class="blk"/>
  <circle cx="926" cy="231" r="6.5" fill="#fff" stroke="#111" stroke-width="4"/>
  <line x1="933" y1="231" x2="986" y2="231" class="blk" marker-end="url(#arrow)"/>
  <line x1="926" y1="238" x2="926" y2="306" class="blk" marker-end="url(#arrow)"/>
  <rect x="897" y="306" width="62" height="43" fill="#fff" stroke="#8be3b1" stroke-width="3"/>
  <text x="928" y="333" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#72dca3">FOP</text>
  <rect x="733" y="340" width="82" height="38" fill="#fff" stroke="#5b2990" stroke-width="4"/>
  <text x="774" y="365" text-anchor="middle" class="serif" font-size="20" font-style="italic" fill="#5b2990">L<tspan baseline-shift="sub" font-size="13">dc</tspan></text>
  <path d="M928 349 L928 359 L815 359" class="blk" marker-end="url(#arrow)"/>
  <path d="M774 340 L774 324 L719 324 L719 307" class="blk" marker-end="url(#arrow)"/>

  <!-- Conv3 -->
  <text x="1104" y="130" text-anchor="middle" class="sans" font-size="20" fill="#111">Conv3</text>
  <rect x="987" y="142" width="238" height="206" class="outer"/>
  <rect x="1008" y="161" width="42" height="141" class="bn"/>
  <rect x="1064" y="161" width="43" height="141" class="conv"/>
  <rect x="1116" y="161" width="43" height="141" class="relu"/>
  <rect x="1173" y="161" width="42" height="141" class="pool"/>
  <text x="1029" y="232" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#56bfc6" transform="rotate(-90 1029 232)">BatchNorm</text>
  <text x="1086" y="232" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#ee8b67" transform="rotate(-90 1086 232)">Conv</text>
  <text x="1138" y="232" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#be8add" transform="rotate(-90 1138 232)">ReLU</text>
  <text x="1195" y="232" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#7abd52" transform="rotate(-90 1195 232)">AvgPooling</text>
  <line x1="1050" y1="231" x2="1064" y2="231" class="thin" marker-end="url(#arrow)"/>
  <line x1="1107" y1="231" x2="1116" y2="231" class="thin" marker-end="url(#arrow)"/>
  <line x1="1159" y1="231" x2="1173" y2="231" class="thin" marker-end="url(#arrow)"/>

  <line x1="1225" y1="231" x2="1286" y2="231" class="blk"/>
  <circle cx="1292" cy="231" r="6.5" fill="#fff" stroke="#111" stroke-width="4"/>
  <line x1="1299" y1="231" x2="1362" y2="231" class="blk" marker-end="url(#arrow)"/>
  <line x1="1292" y1="238" x2="1292" y2="306" class="blk" marker-end="url(#arrow)"/>
  <rect x="1255" y="306" width="62" height="43" fill="#fff" stroke="#8be3b1" stroke-width="3"/>
  <text x="1286" y="333" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#72dca3">FOP</text>
  <rect x="1086" y="340" width="82" height="38" fill="#fff" stroke="#5b2990" stroke-width="4"/>
  <text x="1127" y="365" text-anchor="middle" class="serif" font-size="20" font-style="italic" fill="#5b2990">L<tspan baseline-shift="sub" font-size="13">dc</tspan></text>
  <path d="M1286 349 L1286 359 L1168 359" class="blk" marker-end="url(#arrow)"/>
  <path d="M1127 340 L1127 324 L1085 324 L1085 307" class="blk" marker-end="url(#arrow)"/>

  <!-- Linear classifier -->
  <text x="1452" y="130" text-anchor="middle" class="sans" font-size="20" fill="#111">Linear Classifier</text>
  <rect x="1362" y="142" width="176" height="206" class="outer"/>
  <rect x="1385" y="161" width="43" height="141" fill="#f6f8ff" stroke="#a6c1ff" stroke-width="4"/>
  <rect x="1438" y="161" width="43" height="141" class="drop"/>
  <rect x="1490" y="161" width="43" height="141" class="fc"/>
  <text x="1407" y="232" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#9eb6ed" transform="rotate(-90 1407 232)">Flatten</text>
  <text x="1460" y="232" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#c8ad33" transform="rotate(-90 1460 232)">Dropout</text>
  <text x="1512" y="232" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#ef83a9" transform="rotate(-90 1512 232)">FC</text>
  <line x1="1428" y1="231" x2="1438" y2="231" class="thin" marker-end="url(#arrow)"/>
  <line x1="1481" y1="231" x2="1490" y2="231" class="thin" marker-end="url(#arrow)"/>
  <line x1="1460" y1="302" x2="1460" y2="382" class="blk" marker-end="url(#arrow)"/>
  <text x="1460" y="426" text-anchor="middle" class="sans" font-size="19" fill="#111">Regularization</text>

  <!-- Output -->
  <line x1="1538" y1="231" x2="1608" y2="231" class="blk" marker-end="url(#arrow)"/>
  <text x="1616" y="218" class="sans" font-size="19" font-weight="700" fill="#111">Output</text>
  <text x="1616" y="253" class="serif" font-size="21" fill="#111">E[Y<tspan baseline-shift="super" font-size="13">2</tspan>]</text>

  <!-- Bottom explanatory text -->
  <text x="215" y="410" class="sans" font-size="19" fill="#111">Creating noisy samples</text>
  <text x="206" y="445" class="serif" font-size="20" font-style="italic" fill="#111">
    X<tspan baseline-shift="sub" font-size="13">i,j</tspan> = Dropout(X′<tspan baseline-shift="sub" font-size="13">i</tspan>), j = 1, 2, ... , n,
  </text>
  <text x="260" y="480" class="serif" font-size="20" font-style="italic" fill="#111">
    X ∈ ℝ<tspan baseline-shift="super" font-size="13">B×N×F</tspan>
  </text>

  <!-- Loss formula block -->
  <text x="615" y="426" class="serif" font-size="20" font-style="italic" fill="#111">
    L = αED<tspan baseline-shift="sub" font-size="13">c</tspan> − (1 − α)ED<tspan baseline-shift="sub" font-size="13">d</tspan>
  </text>
  <text x="833" y="416" class="serif" font-size="18" fill="#111">
    ED<tspan baseline-shift="sub" font-size="12">c</tspan> = <tspan font-size="17">1</tspan>/<tspan font-size="17">B</tspan> Σ<tspan baseline-shift="sub" font-size="12">i</tspan> ED (X<tspan baseline-shift="sub" font-size="12">i</tspan><tspan baseline-shift="super" font-size="12">(l)</tspan>)
  </text>
  <text x="833" y="474" class="serif" font-size="18" fill="#111">
    ED<tspan baseline-shift="sub" font-size="12">d</tspan> = ED (E[X<tspan baseline-shift="super" font-size="12">(l)</tspan>])
  </text>

  <text x="1080" y="424" class="serif" font-size="20" fill="#111">ED(X) =</text>
  <text x="1165" y="409" class="serif" font-size="19" fill="#111">
    tr(E[XX<tspan baseline-shift="super" font-size="12">T</tspan>])<tspan baseline-shift="super" font-size="12">2</tspan>
  </text>
  <line x1="1154" y1="420" x2="1285" y2="420" stroke="#111" stroke-width="1.5"/>
  <text x="1155" y="447" class="serif" font-size="19" fill="#111">
    ‖E[XX<tspan baseline-shift="super" font-size="12">T</tspan>]‖<tspan baseline-shift="super" font-size="12">2</tspan><tspan baseline-shift="sub" font-size="12">F</tspan>
  </text>
</svg>