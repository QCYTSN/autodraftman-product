<svg xmlns="http://www.w3.org/2000/svg" width="1695" height="528" viewBox="0 0 1695 528">
  <title>Two-phase convolutional training architecture with dropout, FOP, decorrelation loss, and linear classifier</title>
  <desc>
    Inventory: The full figure is a left-to-right neural-network training diagram. The origin is the input text and incoming feature tensor at left. Phase 1 training is enclosed by a large rounded dotted frame containing Conv1, Conv2, and Conv3 blocks. Each convolution block contains vertically labeled processing modules connected horizontally, with feedback branches through FOP and Ldc boxes. Dropout locations create noisy samples and loss terms below the frame. Phase 2 training is enclosed by a separate rounded dotted frame containing a linear classifier with Flatten, Dropout, and FC modules, plus a regularization branch. Whole-section basis: left-to-right pipeline symmetry with repeated convolutional module groups and vertical downward auxiliary branches.
  </desc>

  <defs>
    <marker id="arrowBlack" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#000000" id="plus_node_0" />
    </marker>
    <marker id="arrowBlackStart" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="1" refY="5" orient="auto-start-reverse">
      <path d="M12,0 L0,5 L12,10 Z" fill="#000000" id="plus_node_1" />
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill:#000; font-size:20px; }
      .small { font-family: Arial, Helvetica, sans-serif; fill:#000; font-size:19px; }
      .math { font-family: "Times New Roman", Times, serif; fill:#000; font-size:24px; font-style:italic; }
      .mathSmall { font-family: "Times New Roman", Times, serif; fill:#000; font-size:22px; font-style:italic; }
      .upright { font-style:normal; }
      .blockTitle { font-family: Arial, Helvetica, sans-serif; fill:#000; font-size:20px; }
      .vText { font-family: Arial, Helvetica, sans-serif; font-size:19px; font-weight:600; text-anchor:middle; dominant-baseline:middle; }
      .outerStroke { fill:#f6f5f6; stroke:#777777; stroke-width:4; }
      .innerLine { stroke:#000; stroke-width:4; fill:none; }
    </style>
  </defs>

  
  <rect id="f00_canvas_background" data-plus-kind="frame" x="0" y="0" width="1695" height="528" fill="#ffffff" stroke="none" />

  
  <text id="phase1_label" class="label" x="730" y="47" text-anchor="middle">Phase 1  training</text>
  <path id="phase1_brace" d="M202,90 C202,78 202,74 206,74 H727 Q730,74 730,63 Q730,74 733,74 H1257 C1261,74 1261,78 1261,90" fill="none" stroke="#000" stroke-width="2" />
  <text id="phase2_label" class="label" x="1439" y="50" text-anchor="middle">Phase 2 training</text>
  <path id="phase2_brace" d="M1306,90 C1306,78 1306,74 1310,74 H1436 Q1439,74 1439,63 Q1439,74 1442,74 H1570 C1574,74 1574,78 1574,90" fill="none" stroke="#000" stroke-width="2" />

  
  <rect id="f01_phase1_training_frame" data-plus-kind="frame" x="189" y="97" width="1096" height="290" rx="42" ry="42" fill="none" stroke="#777777" stroke-width="4" stroke-dasharray="4 5" />
  <rect id="f02_phase2_training_frame" data-plus-kind="frame" x="1311" y="97" width="264" height="290" rx="42" ry="42" fill="none" stroke="#777777" stroke-width="4" stroke-dasharray="4 5" />

  
  <g id="input_group">
    <text id="input_title" class="label" x="82" y="208" text-anchor="middle" font-weight="700">Input</text>
    <text id="input_tensor" class="math" xml:space="preserve"><tspan x="36" y="235">X</tspan><tspan x="51" y="226" font-size="15">′</tspan><tspan x="63" y="235" class="upright"> ∈ </tspan><tspan x="96" y="235">ℝ</tspan><tspan x="113" y="224" font-size="15">B×F</tspan></text><text id="input_shape" class="math" xml:space="preserve"><tspan x="18" y="261">F</tspan><tspan x="35" y="261" class="upright"> = </tspan><tspan x="62" y="261">c</tspan><tspan x="78" y="261" class="upright"> × </tspan><tspan x="104" y="261">h</tspan><tspan x="121" y="261" class="upright"> × </tspan><tspan x="147" y="261">w</tspan></text></g>

  
  <path id="arrow_input_to_conv1" d="M158,222 H211" class="innerLine" marker-end="url(#arrowBlack)" />
  <path id="arrow_conv1_to_conv2" d="M480,222 H599" class="innerLine" marker-end="url(#arrowBlack)" />
  <path id="arrow_conv2_to_conv3" d="M827,222 H946" class="innerLine" marker-end="url(#arrowBlack)" />
  <path id="arrow_conv3_to_classifier" d="M1174,222 H1349" class="innerLine" marker-end="url(#arrowBlack)" />
  <path id="arrow_classifier_to_output" d="M1529,222 H1589" class="innerLine" marker-end="url(#arrowBlack)" />

  
