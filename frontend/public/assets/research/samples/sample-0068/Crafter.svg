  <rect x="93" y="135" width="336" height="216" rx="42" ry="42" fill="#e7fad8" stroke="#cadbbc" stroke-width="4"/>
  <text x="125" y="164" font-family="sans-serif" font-size="26" fill="#000000">Beams2D</text>

  <rect x="75" y="174" width="336" height="216" rx="42" ry="42" fill="#e7fad8" stroke="#cadbbc" stroke-width="4"/>
  <text x="106" y="209" font-family="sans-serif" font-size="26" fill="#000000">HeatConduction</text>

  <rect x="57" y="217" width="336" height="217" rx="42" ry="42" fill="#e7fad8" stroke="#cadbbc" stroke-width="4"/>
  <text x="89" y="254" font-family="sans-serif" font-size="26" fill="#000000">Airfoil</text>

  <rect x="84" y="272" width="282" height="64" rx="12" ry="12" fill="#c6f19e" stroke="#c4efa3" stroke-width="2"/>
  <text x="225" y="314" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#000000">Simulator</text>

  <rect x="84" y="351" width="282" height="64" rx="12" ry="12" fill="#c6f19e" stroke="#c4efa3" stroke-width="2"/>
  <text x="225" y="393" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#000000">Dataset</text>

  <!-- Python API panel -->
  <rect x="503" y="160" width="489" height="215" rx="43" ry="43" fill="#ffedab" stroke="#ffe27b" stroke-width="4"/>
  <text x="551" y="192" font-family="sans-serif" font-size="26" fill="#000000">Python API</text>

  <rect x="516" y="208" width="459" height="150" rx="23" ry="23" fill="#fff8e7" stroke="#dedede" stroke-width="3"/>
  <text x="526" y="256" font-family="monospace" font-size="24.5" fill="#000000">problem.simulate(design, conds)</text>
  <text x="526" y="292" font-family="monospace" font-size="24.5" fill="#000000">problem.optimize(design, conds)</text>
  <text x="526" y="327" font-family="monospace" font-size="24.5" fill="#000000">problem.dataset</text>

  <!-- Arrows between cards and API -->
  <path d="M366 290 C414 263, 454 253, 517 248" fill="none" stroke="#000000" stroke-width="2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <path d="M366 310 C418 288, 456 286, 517 286" fill="none" stroke="#000000" stroke-width="2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <path d="M517 320 C465 331, 417 354, 366 382" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrowEnd)"/>

  <!-- EngiOpt buttons -->
  <rect x="1049" y="126" width="279" height="78" rx="14" ry="14" fill="#c8e1fb" stroke="#acd5fa" stroke-width="4"/>
  <text x="1188.5" y="166.5" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="26" fill="#000000">Optimization</text>

  <rect x="1049" y="228" width="279" height="78" rx="14" ry="14" fill="#c8e1fb" stroke="#acd5fa" stroke-width="4"/>
