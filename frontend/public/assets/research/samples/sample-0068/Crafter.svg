<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1377 492" width="1377" height="492">
  <rect x="0" y="0" width="1377" height="492" fill="#ffffff"/>

  <defs>
    <marker id="arrowEnd" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3 0,6" fill="#000000"/>
    </marker>
    <marker id="arrowStart" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3 0,6" fill="#000000"/>
    </marker>
  </defs>

  <!-- Main containers -->
  <rect x="25" y="28" width="998" height="434" rx="86" ry="86" fill="#fdfdfd" stroke="#e4e4e4" stroke-width="3"/>
  <rect x="1038" y="30" width="306" height="431" rx="60" ry="60" fill="#fdfdfd" stroke="#e4e4e4" stroke-width="3"/>

  <!-- Titles -->
  <text x="524" y="73" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700" fill="#000000">EngiBench</text>
  <text x="1191" y="73" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700" fill="#000000">EngiOpt</text>

  <!-- Stacked problem cards -->
  <rect x="109" y="99" width="336" height="216" rx="42" ry="42" fill="#e7fad8" stroke="#cadbbc" stroke-width="4"/>
