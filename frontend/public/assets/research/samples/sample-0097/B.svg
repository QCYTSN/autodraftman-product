<svg xmlns="http://www.w3.org/2000/svg" width="879" height="405" viewBox="0 0 879 405">
  <title>Encoder architecture diagram</title>
  <desc>
    Reconstructed editable SVG of an encoder pipeline. Base frames: left rounded self-attention block, middle rounded transformer block, and dashed legend block. Inside the left block are track tokens arranged by video frames and tracks, with read-out tokens in pink at the right. A dense support-track input slab feeds upward into the self-attention block. The middle transformer block contains cross-attention between pink read-out tokens and blue motion latent tokens plus vertical self-attention. Motion latents are compressed through a labeled arrow into compressed motion latents. Legend maps token styles to meanings.
  </desc>

  <defs>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="14" viewBox="0 0 18 14" refX="17" refY="7" orient="auto">
      <path d="M0,0 L18,7 L0,14 Z" fill="#9fa4a6" id="plus_node_0" />
    </marker>
    <marker id="arrow-dark" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" viewBox="0 0 10 8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#4a4f52" id="plus_node_1" />
    </marker>
    <marker id="arrow-thin" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" viewBox="0 0 10 8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#4b4f53" id="plus_node_2" />
    </marker>
    <style>
      .label{font-family:Arial, Helvetica, sans-serif; fill:#42474b;}
      .small{font-size:12px;}
      .med{font-size:14px;}
      .title{font-size:22px;}
      .blocktitle{font-size:17px;}
      .tiny{font-size:11px;}
      .token-stroke{stroke:#4e5960; stroke-width:1.3; stroke-linejoin:round;}
      .grey-front{fill:#dce1e5;}
      .grey-top{fill:#eef1f3;}
      .grey-side{fill:#aeb7bf;}
      .pink-front{fill:#f3cbd0;}
      .pink-top{fill:#f8dfe1;}
      .pink-side{fill:#c8969d;}
      .blue-front{fill:#aac7ee;}
      .blue-top{fill:#d3e3fa;}
      .blue-side{fill:#7193c5;}
      .dotted{stroke:#40484e; stroke-width:2; stroke-linecap:round; stroke-dasharray:1 7;}
    </style>
  </defs>

