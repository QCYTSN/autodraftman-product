  <title>Multimodal retrieval systems and Audio-Centric MultiModal evaluation suite</title>
  <desc>Inventory: top section compares query modalities routed to a multimodal retrieval encoder and OmniRet, both sending query embeddings into a shared vector database and returning target modalities. Bottom section contains four evaluation-task frames: Single Modality, Textual Binding, Visual-Audio, Composed Visual Text, and Composed Audio Text, with modality icons, plus signs and directional arrows. Layout basis: top is horizontally balanced around a central database, with query inputs left and targets right; bottom suite is partitioned into two columns and stacked task rows.</desc>

  
