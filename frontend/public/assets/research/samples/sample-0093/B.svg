      <tspan x="315" dy="0">issue</tspan>
      <tspan x="315" dy="24">description</tspan>
      <tspan x="315" dy="24" font-style="italic">d</tspan><tspan baseline-shift="sub" font-size="13">issue</tspan>
    </text>

    <text id="label_old_code" x="562" y="47" font-size="20" text-anchor="middle">
      <tspan x="562" dy="0">old</tspan>
      <tspan x="562" dy="24">code</tspan>
      <tspan x="562" dy="24" font-style="italic">c</tspan><tspan baseline-shift="sub" font-size="13">old</tspan>
    </text>

    <text id="label_input_x" x="409" y="74" font-size="20">
      input <tspan font-style="italic">x</tspan>
    </text>

    <text id="label_otter" x="47" y="164" font-size="20">Otter</text>
    <text id="label_localizer" x="121" y="226" font-size="20">Localizer</text>
    <text id="label_action_planner" x="121" y="494" font-size="20">
      <tspan x="121" dy="0">Self-reflective</tspan>
      <tspan x="121" dy="25">action planner</tspan>
    </text>
    <text id="label_test_generator" x="126" y="817" font-size="20">Test generator</text>

    <text id="label_localize_test_files" x="343.5" y="177" font-size="20" text-anchor="middle">
      <tspan x="343.5" dy="0">Localize</tspan>
      <tspan x="343.5" dy="24">test files</tspan>
    </text>
    <text id="label_localize_test_functions" x="343.5" y="248" font-size="20" text-anchor="middle">
      <tspan x="343.5" dy="0">Localize</tspan>
      <tspan x="343.5" dy="24">test functions</tspan>
    </text>
    <text id="label_localize_focal_files" x="563.5" y="177" font-size="20" text-anchor="middle">
      <tspan x="563.5" dy="0">Localize</tspan>
      <tspan x="563.5" dy="24">focal files</tspan>
    </text>
    <text id="label_localize_focal_functions" x="563.5" y="248" font-size="20" text-anchor="middle">
      <tspan x="563.5" dy="0">Localize</tspan>
      <tspan x="563.5" dy="24">focal functions</tspan>
    </text>

    <text id="label_test_files_functions" x="344" y="336" font-size="20" text-anchor="middle">
      <tspan x="344" dy="0">test</tspan>
      <tspan x="344" dy="24">files and</tspan>
      <tspan x="344" dy="24">functions</tspan>
    </text>
    <text id="label_focal_files_functions" x="564" y="336" font-size="20" text-anchor="middle">
      <tspan x="564" dy="0">focal</tspan>
      <tspan x="564" dy="24">files and</tspan>
      <tspan x="564" dy="24">functions</tspan>
    </text>

    <text id="label_execute_read_actions_planner" x="344.5" y="462" font-size="20" text-anchor="middle" fill="#ffffff">
      <tspan x="344.5" dy="0">Execute</tspan>
      <tspan x="344.5" dy="24">read actions</tspan>
    </text>
    <text id="label_make_initial_plan" x="344.5" y="535" font-size="20" text-anchor="middle">
      <tspan x="344.5" dy="0">Make</tspan>
      <tspan x="344.5" dy="24">initial plan</tspan>
    </text>
    <text id="label_validate_planned_actions" x="564.5" y="462" font-size="20" text-anchor="middle" fill="#ffffff">
      <tspan x="564.5" dy="0">Validate</tspan>
      <tspan x="564.5" dy="24">planned actions</tspan>
    </text>
    <text id="label_reflect_improve_plan" x="563.5" y="535" font-size="20" text-anchor="middle">
      <tspan x="563.5" dy="0">Reflect and</tspan>
      <tspan x="563.5" dy="24">improve plan</tspan>
    </text>

    <text id="label_planned_actions" x="441" y="632" font-size="20" text-anchor="middle">
      <tspan x="441" dy="0">planned</tspan>
      <tspan x="441" dy="24">actions</tspan>
    </text>

    <text id="label_execute_read_actions_generator" x="441" y="737" font-size="20" text-anchor="middle" fill="#ffffff">
      <tspan x="441" dy="0">Execute</tspan>
      <tspan x="441" dy="24">read actions</tspan>
    </text>
    <text id="label_flesh_out_write_modify" x="440.5" y="805" font-size="20" text-anchor="middle">
      <tspan x="440.5" dy="0">Flesh out write</tspan>
      <tspan x="440.5" dy="24">or modify action</tspan>
    </text>
    <text id="label_repair_generated_tests" x="441" y="874" font-size="20" text-anchor="middle" fill="#ffffff">
      <tspan x="441" dy="0">Repair</tspan>
      <tspan x="441" dy="24">generated tests</tspan>
    </text>

    <text id="label_generated_tests" x="441" y="982" font-size="20" text-anchor="middle">
      <tspan x="441" dy="0">generated</tspan>
      <tspan x="441" dy="24">tests</tspan>
      <tspan x="441" dy="24" font-style="italic">y</tspan>
    </text>

    <text id="label_output_y" x="506" y="1001" font-size="20">
      output <tspan font-style="italic">y</tspan>
    </text>

    <text id="legend_title" x="42" y="971" font-size="19" text-decoration="underline">Legend:</text>
    <text id="legend_data_label" x="64" y="1018" font-size="18" text-anchor="middle">data</text>
    <text id="legend_llm_label" x="152.5" y="1017" font-size="20" text-anchor="middle">LLM call</text>
    <text id="legend_rule_label" x="276" y="1017" font-size="20" text-anchor="middle" fill="#ffffff">Rule-based</text>
  </g>
</svg>