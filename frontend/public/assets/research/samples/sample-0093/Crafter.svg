      .data { fill:#fff; stroke:#000; stroke-width:2.4; }
      .rule { fill:#000; stroke:#000; stroke-width:1.5; }
      .arrow { stroke:#000; stroke-width:2.4; fill:none; marker-end:url(#arrow); }
      .smallarrow { stroke:#000; stroke-width:2.1; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="708" height="1062" fill="#ffffff"/>

