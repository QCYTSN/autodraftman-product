<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 1062" width="708" height="1062">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000"/>
    </marker>
    <style>
