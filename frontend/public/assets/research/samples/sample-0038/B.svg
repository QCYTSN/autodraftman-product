<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="360" viewBox="0 0 1220 360">
  <title>Pipeline diagram for channel importance estimation, top-k channel selection, channel partitioning, and shared/routed experts with low-rank adaptor</title>
  <desc>Frame f01 contains token matrices from calibration data, channel-wise and token-wise axes, ellipsis, a Hadamard product dot, and a W weight column. Frame f02 contains top-k importance and sparse important-channel matrices per token with an arrow from f01. Frame f03 contains an important channel frequency chart with token-independent and token-dependent channel annotations. Frame f04 contains arrows to shared and routed expert blocks with low-rank adaptor hourglass shapes. Frame f05 contains the legend. The layout follows a left-to-right processing flow with horizontal symmetry along the central pipeline and repeated top/bottom expert boxes.</desc>

  <defs>
    <marker id="arrow-standard" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="14" viewBox="0 0 18 14" refX="17" refY="7" orient="auto">
      <path d="M0,0 L18,7 L0,14 Z" fill="#fff" stroke="#000" stroke-width="2" id="plus_node_0" />
    </marker>
    <marker id="small-black-arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" viewBox="0 0 9 7" refX="8.5" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#000" id="plus_node_1" />
    </marker>
    <marker id="thin-black-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" viewBox="0 0 10 8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000" id="plus_node_2" />
    </marker>
  </defs>

  <rect width="1220" height="360" fill="#fff" id="plus_node_3" />

  
