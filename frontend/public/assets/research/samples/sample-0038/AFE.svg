<svg width="3840" height="1133" viewBox="0 0 3840 1133" xmlns="http://www.w3.org/2000/svg">
  <rect width="3840" height="1133" fill="white"/>
  <g transform="scale(3.75)" font-family="Times New Roman, Times, serif" fill="#000" stroke-linecap="square" stroke-linejoin="miter">
    <style>
      .bold{font-weight:700}
      .italic{font-style:italic}
      .cell{stroke:#000;stroke-width:1.6}
      .thin{stroke:#000;stroke-width:1.2;fill:none}
      .arrow{stroke:#000;stroke-width:1.6;fill:white}
      .dash{stroke:#000;stroke-width:1.2;stroke-dasharray:2.2 3.2;fill:none}
      .caption{font-size:15.5px;font-weight:700}
      .title{font-size:17px;font-weight:700}
      .axis{font-size:9px}
      .legendText{font-size:15px;font-weight:700}
    </style>

    <!-- Left title -->
    <text x="84" y="37" class="title">Tokens from</text>
    <text x="180" y="38" font-size="23" font-weight="700" font-style="italic">𝒟</text>

    <!-- Channel/token direction arrows -->
    <path d="M50 198 L50 101" stroke="#000" stroke-width="1.3" fill="none"/>
    <path d="M50 101 L46 110 M50 101 L54 110" stroke="#000" stroke-width="1.3" fill="none"/>
    <text x="-190" y="36" transform="rotate(-90)" font-size="14">Channel-wise</text>
    <path d="M60 207 L136 207" stroke="#000" stroke-width="1.3" fill="none"/>
    <path d="M136 207 L128 203 M136 207 L128 211" stroke="#000" stroke-width="1.3" fill="none"/>
    <text x="63" y="226" font-size="14">Token-wise</text>

    <!-- Tokens matrix -->
    <g transform="translate(60,50)">
      <rect class="cell" x="0" y="0" width="28" height="28" fill="#dfead6"/>
      <rect class="cell" x="32" y="0" width="28" height="28" fill="#4f852f"/>
      <rect class="cell" x="64" y="0" width="28" height="28" fill="#f3b27d"/>

      <rect class="cell" x="0" y="32" width="28" height="28" fill="#a7cb8e"/>
      <rect class="cell" x="32" y="32" width="28" height="28" fill="#dfead6"/>
      <rect class="cell" x="64" y="32" width="28" height="28" fill="#f7ddc7"/>

      <rect class="cell" x="0" y="64" width="28" height="28" fill="#c1dcaf"/>
      <rect class="cell" x="32" y="64" width="28" height="28" fill="#2f5b21"/>
      <rect class="cell" x="64" y="64" width="28" height="28" fill="#f2c6a2"/>

      <rect class="cell" x="0" y="96" width="28" height="28" fill="#4f8734"/>
      <rect class="cell" x="32" y="96" width="28" height="28" fill="#dfead6"/>
      <rect class="cell" x="64" y="96" width="28" height="28" fill="#f1c49e"/>

      <rect class="cell" x="0" y="128" width="28" height="28" fill="#dfead6"/>
      <rect class="cell" x="32" y="128" width="28" height="28" fill="#bdd9ad"/>
      <rect class="cell" x="64" y="128" width="28" height="28" fill="#93450e"/>
    </g>

    <!-- Ellipsis -->
    <circle cx="158" cy="125" r="3.2" fill="#000"/>
    <circle cx="168" cy="125" r="3.2" fill="#000"/>
    <circle cx="178" cy="125" r="3.2" fill="#000"/>

    <!-- Language token column -->
    <g transform="translate(187,50)">
      <rect class="cell" x="0" y="0" width="28" height="28" fill="#f1c49e"/>
      <rect class="cell" x="0" y="32" width="28" height="28" fill="#f3ad79"/>
      <rect class="cell" x="0" y="64" width="28" height="28" fill="#d4630b"/>
      <rect class="cell" x="0" y="96" width="28" height="28" fill="#f7dcc7"/>
      <rect class="cell" x="0" y="128" width="28" height="28" fill="#f3ad79"/>
    </g>

    <!-- Hadamard product symbol -->
    <circle cx="237" cy="125" r="11.5" fill="white" stroke="#000" stroke-width="1.8"/>
    <circle cx="237" cy="125" r="3.2" fill="#000"/>

    <!-- W title and column -->
    <text x="265" y="38" class="title">W</text>
    <g transform="translate(260,50)">
      <rect class="cell" x="0" y="0" width="28" height="28" fill="#2d78b7"/>
      <rect class="cell" x="0" y="32" width="28" height="28" fill="#b5d0e6"/>
      <rect class="cell" x="0" y="64" width="28" height="28" fill="#dceaf4"/>
      <rect class="cell" x="0" y="96" width="28" height="28" fill="#2d78b7"/>
      <rect class="cell" x="0" y="128" width="28" height="28" fill="#1a4e78"/>
    </g>

    <!-- Arrow to top-k -->
    <polygon class="arrow" points="298,103 311,103 311,84 333,125 311,146 311,130 298,130"/>

    <!-- Top-k title -->
    <text x="359" y="36" class="title">Top-<tspan font-style="italic">k</tspan> importance</text>

    <!-- Top-k importance grid -->
    <g transform="translate(344,50)">
      <!-- light background cells -->
      <g fill="#e8e8e8" stroke="none">
        <rect x="0" y="0" width="28" height="28"/><rect x="32" y="0" width="28" height="28"/><rect x="64" y="0" width="28" height="28"/>
        <rect x="0" y="32" width="28" height="28"/><rect x="32" y="32" width="28" height="28"/><rect x="64" y="32" width="28" height="28"/>
        <rect x="0" y="64" width="28" height="28"/><rect x="32" y="64" width="28" height="28"/><rect x="64" y="64" width="28" height="28"/>
        <rect x="0" y="96" width="28" height="28"/><rect x="32" y="96" width="28" height="28"/><rect x="64" y="96" width="28" height="28"/>
        <rect x="0" y="128" width="28" height="28"/><rect x="32" y="128" width="28" height="28"/><rect x="64" y="128" width="28" height="28"/>
      </g>
      <rect class="cell" x="32" y="0" width="28" height="28" fill="#bdbdbd"/>
      <rect class="cell" x="64" y="0" width="28" height="28" fill="#cfcfcf"/>
      <rect class="cell" x="0" y="32" width="28" height="28" fill="#cfcfcf"/>
      <rect class="cell" x="32" y="64" width="28" height="28" fill="#8a8a8a"/>
      <rect class="cell" x="0" y="96" width="28" height="28" fill="#8a8a8a"/>
      <rect class="cell" x="64" y="128" width="28" height="28" fill="#4d4d4d"/>
    </g>

