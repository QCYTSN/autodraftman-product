    <circle cx="440" cy="125" r="3.2" fill="#000"/>
    <circle cx="450" cy="125" r="3.2" fill="#000"/>
    <circle cx="460" cy="125" r="3.2" fill="#000"/>

    <!-- Top-k single channel column -->
    <g transform="translate(470,50)">
      <rect x="0" y="0" width="28" height="28" fill="#d3d3d3"/>
      <rect x="0" y="32" width="28" height="28" fill="#c6c6c6"/>
      <rect class="cell" x="0" y="64" width="28" height="28" fill="#c7c7c7"/>
      <rect x="0" y="96" width="28" height="28" fill="#e2e2e2"/>
      <rect class="cell" x="0" y="128" width="28" height="28" fill="#808080"/>
    </g>

