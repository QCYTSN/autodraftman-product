    <polygon class="arrow" points="508,103 521,103 521,84 543,125 521,146 521,130 508,130"/>

    <!-- Chart title -->
    <text x="569" y="37" class="title">Important channel frequency</text>

    <!-- Frequency chart -->
    <g>
      <rect x="580" y="45" width="183" height="138" fill="white"/>
      <line x1="580" y1="183" x2="763" y2="183" stroke="#000" stroke-width="1"/>
      <line x1="580" y1="45" x2="580" y2="183" stroke="#000" stroke-width="1"/>
      <line x1="763" y1="45" x2="763" y2="183" stroke="#d5d5d5" stroke-width="1"/>
      <line x1="580" y1="45" x2="763" y2="45" stroke="#d5d5d5" stroke-width="1"/>

      <path d="M580,68 C586,68 591,68 593,70 C595,79 595,88 601,96 C604,101 608,102 611,104 C613,111 615,119 619,124 C622,131 623,139 628,143 C632,148 636,151 640,154 L640,183 L580,183 Z" fill="#98d2ea" opacity="0.95"/>
      <path d="M640,154 C647,161 654,166 665,172 C681,178 707,180 763,181 L763,183 L640,183 Z" fill="#f7c7dc" opacity="0.95"/>
      <path d="M580,68 C586,68 591,68 593,70 C595,79 595,88 601,96 C604,101 608,102 611,104 C613,111 615,119 619,124 C622,131 623,139 628,143 C632,148 636,151 640,154 C647,161 654,166 665,172 C681,178 707,180 763,181" fill="none" stroke="#8d9cff" stroke-width="1.1"/>

      <!-- y-axis ticks and labels -->
      <g class="axis" fill="#000">
        <text x="565" y="63">1.0</text>
        <text x="565" y="87">0.8</text>
        <text x="565" y="111">0.6</text>
        <text x="565" y="136">0.4</text>
        <text x="565" y="160">0.2</text>
        <text x="565" y="185">0.0</text>
        <text x="579" y="192">0</text>
        <text x="642" y="192">64</text>
        <text x="744" y="192">256</text>
      </g>
      <text x="615" y="205" font-size="10">Important Channel Index</text>
      <text x="-148" y="560" transform="rotate(-90)" font-size="10">Frequency</text>

      <!-- Annotation boxes -->
      <rect x="612" y="60" width="108" height="27" class="dash"/>
      <text x="622" y="69" font-size="10.5">Token-independent</text>
      <text x="645" y="82" font-size="10.5">Channels</text>
      <path d="M634 90 L613 109" stroke="#000" stroke-width="1.3" fill="none"/>
      <path d="M613 109 L617 100 L622 106 Z" fill="#000"/>

      <rect x="656" y="119" width="97" height="28" class="dash"/>
      <text x="664" y="130" font-size="10.5">Token-dependent</text>
      <text x="682" y="143" font-size="10.5">Channels</text>
      <path d="M689 148 L689 173" stroke="#000" stroke-width="1.3" fill="none"/>
      <path d="M689 173 L684 164 L694 164 Z" fill="#000"/>
    </g>

    <!-- Outlined arrows to experts -->
    <polygon class="arrow" points="770,86 809,76 806,66 834,83 816,105 813,96 775,107"/>
    <polygon class="arrow" points="770,148 809,159 813,144 834,166 806,184 809,172 775,162"/>

    <!-- Shared expert box -->
    <rect x="843" y="28" width="108" height="93" class="dash"/>
    <polygon points="850,32 945,32 916,63 878,63" fill="#91cdeb"/>
    <polygon points="850,117 945,117 916,86 878,86" fill="#91cdeb"/>
    <text x="886" y="80" font-size="14" font-style="italic">r/2</text>
    <path d="M877 70 L877 80 M874 75 L877 75 M918 70 L918 80 M918 75 L921 75" stroke="#000" stroke-width="1.2" fill="none"/>
    <text x="959" y="80" font-size="16" font-weight="700">Shared Expert</text>

    <!-- Routed experts box -->
    <rect x="843" y="130" width="108" height="92" class="dash"/>
    <polygon points="850,133 945,133 916,163 878,163" fill="#f3c4ea"/>
    <polygon points="850,218 945,218 916,187 878,187" fill="#f3c4ea"/>
    <text x="886" y="181" font-size="14" font-style="italic">r/2</text>
    <path d="M877 171 L877 181 M874 176 L877 176 M918 171 L918 181 M918 176 L921 176" stroke="#000" stroke-width="1.2" fill="none"/>
    <text x="959" y="181" font-size="16" font-weight="700">Routed Experts</text>
    <text x="954" y="218" font-size="17">× <tspan font-style="italic">N</tspan><tspan baseline-shift="sub" font-size="11" font-style="italic">r</tspan></text>

    <!-- Captions -->
    <text x="71" y="249" class="caption">Channel importance estimation</text>
    <text x="104" y="266" class="caption">from calibration data</text>

    <text x="339" y="249" class="caption">Top-<tspan font-style="italic">k</tspan> important channel</text>
    <text x="344" y="266" class="caption">identification per token</text>

    <text x="555" y="249" class="caption">Partitioning into token-dependent</text>
    <text x="558" y="266" class="caption">and token-independent Channels</text>

    <text x="813" y="249" class="caption">Shared and routed experts with</text>
    <text x="858" y="266" class="caption">low-rank adaptor</text>

    <!-- Legend rounded box -->
    <rect x="51" y="278" width="998" height="33" rx="5" ry="5" fill="white" stroke="#9a9a9a" stroke-width="1.6"/>

    <!-- Legend: vision token -->
    <g transform="translate(64,286)">
      <rect class="cell" x="0" y="0" width="16" height="16" fill="#bdd9ad"/>
      <rect class="cell" x="18" y="0" width="16" height="16" fill="#dfead6"/>
      <rect class="cell" x="36" y="0" width="16" height="16" fill="#2f5b21"/>
      <rect class="cell" x="54" y="0" width="16" height="16" fill="#dfead6"/>
      <rect class="cell" x="72" y="0" width="16" height="16" fill="#4f852f"/>
    </g>
    <text x="158" y="300" class="legendText">Vision token</text>

    <!-- Legend: language token -->
    <g transform="translate(264,286)">
      <rect class="cell" x="0" y="0" width="16" height="16" fill="#93450e"/>
      <rect class="cell" x="18" y="0" width="16" height="16" fill="#f1c49e"/>
      <rect class="cell" x="36" y="0" width="16" height="16" fill="#f2c6a2"/>
      <rect class="cell" x="54" y="0" width="16" height="16" fill="#f7dcc7"/>
      <rect class="cell" x="72" y="0" width="16" height="16" fill="#f3ad79"/>
    </g>
    <text x="356" y="300" class="legendText">Language token</text>

    <!-- Legend: Hadamard product -->
    <circle cx="496" cy="294" r="8" fill="white" stroke="#000" stroke-width="1.5"/>
    <circle cx="496" cy="294" r="2.2" fill="#000"/>
    <text x="512" y="300" class="legendText">Hadamard product</text>

    <!-- Legend: important channel -->
    <rect x="656" y="286" width="17" height="17" fill="#898989" stroke="#000" stroke-width="1.8"/>
    <text x="678" y="300" class="legendText">Important channel</text>

    <!-- Legend: low-rank adaptor -->
    <g transform="translate(824,283)">
      <polygon points="0,0 32,0 22,12 10,12" fill="#91cdeb"/>
      <polygon points="0,24 32,24 22,12 10,12" fill="#91cdeb"/>
    </g>
    <g transform="translate(865,283)">
      <polygon points="0,0 32,0 22,12 10,12" fill="#f3c4ea"/>
      <polygon points="0,24 32,24 22,12 10,12" fill="#f3c4ea"/>
    </g>
    <text x="900" y="300" class="legendText">Low-rank adapter</text>
  </g>
</svg>