<svg xmlns="http://www.w3.org/2000/svg" width="1593" height="485" viewBox="0 0 1593 485">
  <title>Graph neural network representation and post-readout diagram</title>
  <desc>
    Complete native SVG reconstruction. Inventory: left frame contains three small attributed training graphs, black nodes, black edges, beige and mauve node-attribute rectangles, and a two-line caption. Central frame contains curved arrows from graphs to a sequence of message-passing 3D layers, alternating cream and gray slabs, a double-headed training span arrow and label. Representation frame contains a dashed rounded light-gray region titled Graph Representations with trained representation matrices, sampled augmented representation matrices, fit/sample arrows, and a mixture-model formula. Right frame contains an arrow to a rounded pink post-readout block and caption. Legend frame contains symbols for nodes, edges, node attributes, aggregate, combine, readout, and output of readout. Basis: left graphs are vertically partitioned samples; message-passing slabs follow left-to-right sequence symmetry; representation matrices are paired left/right around the dashed region center; legend is vertically aligned symbol-label pairs.
  </desc>

  <defs>
    <marker id="arrowEnd" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,1 L10,5 L0,9 Z" fill="#000" id="plus_node_0" />
    </marker>
    <marker id="arrowStart" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse">
      <path d="M10,1 L0,5 L10,9 Z" fill="#000" id="plus_node_1" />
    </marker>
    <style>
      .label{font-family:Arial, Helvetica, sans-serif;font-weight:700;fill:#000}
      .smallLabel{font-family:Arial, Helvetica, sans-serif;font-weight:700;font-size:20px;fill:#000}
      .legendText{font-family:Arial, Helvetica, sans-serif;font-weight:700;font-size:19px;fill:#000}
      .math{font-family:"Times New Roman", Times, serif;fill:#000}
      .edge{stroke:#000;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .thinEdge{stroke:#000;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .node{fill:#000;stroke:#000;stroke-width:1}
      .attrCream{fill:#f4d9a7;stroke:#000;stroke-width:1.2}
      .attrMauve{fill:#bea2a3;stroke:#000;stroke-width:1.2}
    </style>
  </defs>

