<svg xmlns="http://www.w3.org/2000/svg" width="693" height="600" viewBox="0 0 693 600">
  <title>C-Siren Module diagram</title>
  <desc>
    Inventory and relationships: A large rounded light-gray outer frame contains the C-Siren Module.
    The center origin is the plus node, fed by an orange left h_l path and a green right epsilon_t path, then sending upward through Linear d_i by d_o, Sine, and x prime.
    Below the plus node is a multiplication node, fed upward by the blue h_x path and leftward by the green alpha_t vector, then feeding upward into plus.
    Left orange subframe processes e_l through Linear, GELU, Linear to h_l. Middle blue subframe processes x similarly to h_x.
    Right green dashed subframe processes t upward through Sinusoidal Embedding, Linear d_T by 2d_i, GELU, Linear 2d_i by 2d_i to epsilon_t; alpha_t branches left into multiply.
    Layout uses left/middle/right equipartition in the lower half, with central vertical black operator chain symmetry.
  </desc>

  <defs>
    <marker id="arrowBlack" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" viewBox="0 0 10 8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000000" id="plus_node_0" />
    </marker>
    <marker id="arrowBlackStart" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" viewBox="0 0 10 8" refX="0" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000000" id="plus_node_1" />
    </marker>
    <marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="16" viewBox="0 0 10 8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#ff7f2a" id="plus_node_2" />
    </marker>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" viewBox="0 0 10 8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#55a9e6" id="plus_node_3" />
    </marker>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="7" viewBox="0 0 10 8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64ae45" id="plus_node_4" />
    </marker>
    <marker id="arrowGreenStart" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="7" viewBox="0 0 10 8" refX="0" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64ae45" id="plus_node_5" />
    </marker>

    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill:#000; }
      .math { font-family: "Times New Roman", Times, serif; font-style: italic; fill:#000; }
      .boxtext { font-family: Arial, Helvetica, sans-serif; font-size:18px; fill:#fff; text-anchor:middle; dominant-baseline:middle; }
      .smallboxtext { font-family: Arial, Helvetica, sans-serif; font-size:18px; fill:#000; text-anchor:middle; dominant-baseline:middle; }
      .dashframe { stroke:#111; stroke-width:1.2; stroke-dasharray:3 2; }
      .thin { stroke-width:2; fill:none; }
    </style>
  </defs>

  
