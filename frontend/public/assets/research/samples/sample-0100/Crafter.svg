<svg viewBox="0 0 1644 471" width="1644" height="471" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowSmallGrey" markerWidth="8" markerHeight="6" refX="7.2" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9e9e9e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1644" height="471" fill="#ffffff"/>

  <!-- outer rounded frame -->
  <rect x="258" y="25" width="1369" height="416" rx="28" ry="28" fill="#ffffff" stroke="#bdbdbd" stroke-width="1.6"/>

  <!-- left side input text and icon -->
  <text x="18" y="110" font-family="serif" font-size="27" font-style="italic" fill="#111">h = {x(m), a(m)}</text>
  <text x="221" y="96" font-family="serif" font-size="17" font-style="italic" fill="#111">l−1</text>
  <text x="205" y="126" font-family="serif" font-size="17" font-style="italic" fill="#111">m=0</text>

  <image id="icon_RAS_01" x="90" y="162" width="52" height="75" href="data:image/png;base64," preserveAspectRatio="xMidYMid meet"/>

  <text x="168" y="162" font-family="serif" font-size="23" font-style="italic" fill="#111">
    π, K<tspan baseline-shift="sub" font-size="15">τ</tspan>, D<tspan baseline-shift="sub" font-size="15">τ</tspan>
  </text>
  <text x="168" y="207" font-family="serif" font-size="24" font-style="italic" fill="#111">r, F, l, c</text>
  <text x="205" y="250" font-family="serif" font-size="24" font-style="italic" fill="#111">f = 0</text>
  <line x1="143" y1="207" x2="255" y2="207" stroke="#9f9f9f" stroke-width="2.5" marker-end="url(#arrowSmallGrey)"/>

  <!-- section headings -->
  <text x="493" y="50" text-anchor="middle" font-family="serif" font-size="28" font-weight="700" fill="#0a0a0a">1) Information Retrieval</text>
  <text x="944" y="50" text-anchor="middle" font-family="serif" font-size="28" font-weight="700" fill="#0a0a0a">2) Prompt Formulation</text>
  <text x="1379" y="50" text-anchor="middle" font-family="serif" font-size="28" font-weight="700" fill="#0a0a0a">3) Generation</text>

  <!-- information retrieval dashed container -->
  <rect x="275" y="62" width="437" height="251" rx="20" ry="20" fill="none" stroke="#c7c7c7" stroke-width="2" stroke-dasharray="10 7"/>
  <rect x="286" y="77" width="416" height="96" rx="15" ry="15" fill="#fff2f3"/>
  <rect x="286" y="189" width="416" height="91" rx="15" ry="15" fill="#f5f9ff"/>

  <text x="494" y="101" text-anchor="middle" font-family="serif" font-size="28" font-weight="700" fill="#111">Filter information</text>
  <text x="494" y="141" text-anchor="middle" font-family="serif" font-size="23" font-style="italic" fill="#111">
    K<tspan baseline-shift="sub" font-size="15">f</tspan> = {k<tspan baseline-shift="sub" font-size="15">i</tspan> ∈ K<tspan baseline-shift="sub" font-size="15">τ</tspan> | isRelevant(k<tspan baseline-shift="sub" font-size="15">i</tspan>, h)}
  </text>
  <text x="494" y="167" text-anchor="middle" font-family="serif" font-size="23" font-style="italic" fill="#111">
    D<tspan baseline-shift="sub" font-size="15">f</tspan> = {d<tspan baseline-shift="sub" font-size="15">i</tspan> ∈ D<tspan baseline-shift="sub" font-size="15">τ</tspan> | isRelevant(d<tspan baseline-shift="sub" font-size="15">i</tspan>, h)}
  </text>

  <text x="494" y="217" text-anchor="middle" font-family="serif" font-size="28" font-weight="700" fill="#111">Select context samples</text>
  <text x="494" y="258" text-anchor="middle" font-family="serif" font-size="22" font-style="italic" fill="#111">
    C<tspan baseline-shift="sub" font-size="14">f</tspan> = arg top<tspan baseline-shift="sub" font-size="14">c</tspan>{d<tspan baseline-shift="sub" font-size="14">i</tspan> ∈ D<tspan baseline-shift="sub" font-size="14">f</tspan> | φ<tspan baseline-shift="sub" font-size="14">t</tspan>(h) · φ<tspan baseline-shift="sub" font-size="14">c</tspan>(d<tspan baseline-shift="sub" font-size="14">i</tspan>)}
  </text>

  <!-- prompt formulation dashed container -->
  <rect x="726" y="62" width="437" height="296" rx="20" ry="20" fill="none" stroke="#c7c7c7" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="945" y="83" text-anchor="middle" font-family="serif" font-size="22" fill="#111">Prompt =</text>
  <text x="945" y="129" text-anchor="middle" font-family="serif" font-size="22" fill="#111">
    &lt;Data description in K<tspan baseline-shift="sub" font-size="15">f</tspan> &gt;
  </text>
  <text x="945" y="176" text-anchor="middle" font-family="serif" font-size="22" fill="#111">
    &lt;Variable descriptions in K<tspan baseline-shift="sub" font-size="15">f</tspan> &gt;
  </text>
  <text x="945" y="222" text-anchor="middle" font-family="serif" font-size="22" fill="#111">
    For c<tspan baseline-shift="sub" font-size="15">i</tspan> ∈ C<tspan baseline-shift="sub" font-size="15">f</tspan> :
  </text>
  <text x="945" y="263" text-anchor="middle" font-family="serif" font-size="22" fill="#111">
    &lt;Sample c<tspan baseline-shift="sub" font-size="15">i</tspan> history&gt;, &lt;Sample c<tspan baseline-shift="sub" font-size="15">i</tspan> future&gt;
  </text>
  <text x="945" y="306" text-anchor="middle" font-family="serif" font-size="22" fill="#111">
    &lt;Target history h &gt;
  </text>
  <text x="945" y="344" text-anchor="middle" font-family="serif" font-size="21" fill="#111">Simulate the next state of the target system.</text>

  <!-- generation dashed container -->
  <rect x="1176" y="62" width="433" height="351" rx="20" ry="20" fill="none" stroke="#c7c7c7" stroke-width="2" stroke-dasharray="10 7"/>

  <rect x="1190" y="77" width="405" height="128" rx="15" ry="15" fill="#fffbe8"/>
  <rect x="1190" y="215" width="405" height="62" rx="14" ry="14" fill="#fbf2ff"/>
  <rect x="1190" y="290" width="405" height="86" rx="14" ry="14" fill="#f2fbf2"/>

  <text x="1392" y="103" text-anchor="middle" font-family="serif" font-size="27" font-weight="700" fill="#111">Generate next state</text>
  <text x="1283" y="145" text-anchor="middle" font-family="serif" font-size="25" font-style="italic" fill="#111">Φ̂ = LLM(Prompt) =</text>

  <!-- small probability density sketch -->
  <path d="M1353 171 C1362 138, 1375 104, 1397 101 C1420 98, 1429 132, 1442 151 C1459 122, 1474 108, 1492 123 C1507 136, 1514 156, 1518 171 Z"
        fill="#9fcfec" stroke="none" opacity="0.75"/>
  <path d="M1358 171 C1367 151, 1381 121, 1399 119 C1420 116, 1430 142, 1443 158 C1454 143, 1469 130, 1488 137 C1501 142, 1511 157, 1517 171 Z"
        fill="#e7c56b" stroke="none" opacity="0.85"/>
  <path d="M1361 171 C1374 147, 1387 129, 1405 127 C1424 125, 1435 145, 1447 160 C1462 139, 1477 123, 1495 134 C1506 141, 1513 157, 1518 171 Z"
        fill="#ef9c8f" stroke="none" opacity="0.85"/>
  <path d="M1354 171 C1363 139, 1376 104, 1397 101 C1420 99, 1429 132, 1443 151 C1459 122, 1474 108, 1492 123 C1507 136, 1514 156, 1518 171"
        fill="none" stroke="#7ab8da" stroke-width="1.2"/>
  <path d="M1358 171 C1371 147, 1386 126, 1405 126 C1425 126, 1435 145, 1447 160 C1462 139, 1478 124, 1495 134 C1506 141, 1513 157, 1518 171"
        fill="none" stroke="#d18476" stroke-width="1.2"/>

  <text x="1524" y="112" font-family="serif" font-size="21" font-style="italic" fill="#111">P(x<tspan baseline-shift="sub" font-size="14">1</tspan>)</text>
  <text x="1524" y="138" font-family="serif" font-size="21" font-style="italic" fill="#111">P(x<tspan baseline-shift="sub" font-size="14">2</tspan>)</text>
  <text x="1524" y="164" font-family="serif" font-size="21" font-style="italic" fill="#111">P(x<tspan baseline-shift="sub" font-size="14">3</tspan>)</text>
  <text x="1539" y="190" font-family="serif" font-size="22" font-style="italic" fill="#111">⋮</text>

  <text x="1285" y="173" text-anchor="middle" font-family="serif" font-size="24" font-style="italic" fill="#111">f = f + 1</text>
  <text x="1285" y="199" text-anchor="middle" font-family="serif" font-size="24" font-style="italic" fill="#111">x(f) ~ Φ̂</text>

  <text x="1392" y="242" text-anchor="middle" font-family="serif" font-size="27" font-weight="700" fill="#111">Generate next action</text>
  <text x="1392" y="267" text-anchor="middle" font-family="serif" font-size="24" font-style="italic" fill="#111">
    a(f) ~ π(x(f), f)
  </text>

  <text x="1392" y="317" text-anchor="middle" font-family="serif" font-size="27" font-weight="700" fill="#111">Update history</text>
  <text x="1392" y="346" text-anchor="middle" font-family="serif" font-size="24" font-style="italic" fill="#111">
    h = h ∪ {x(f), a(f)}
  </text>
  <text x="1392" y="373" text-anchor="middle" font-family="serif" font-size="24" font-style="italic" fill="#111">
    h = {h<tspan baseline-shift="sub" font-size="16">i</tspan>}
    <tspan baseline-shift="super" font-size="16">f</tspan>
    <tspan baseline-shift="sub" font-size="16" dx="-8">i=f−l+1</tspan>
  </text>

  <!-- loop arrows at bottom: resized and label-cleared -->
  <line x1="1168" y1="406" x2="362" y2="406" stroke="#b3b3b3" stroke-width="8" stroke-linecap="butt"/>
  <line x1="362" y1="406" x2="362" y2="335" stroke="#b3b3b3" stroke-width="8" stroke-linecap="butt"/>
  <polygon points="362,300 345,337 379,337" fill="#b3b3b3"/>
  <line x1="762" y1="406" x2="762" y2="386" stroke="#b3b3b3" stroke-width="8" stroke-linecap="butt"/>
  <polygon points="762,354 746,386 778,386" fill="#b3b3b3"/>

  <text x="392" y="398" text-anchor="middle" font-family="serif" font-size="20" fill="#111">Else</text>
  <text x="1033" y="398" text-anchor="middle" font-family="serif" font-size="22" fill="#111">While f &lt; F</text>
  <text x="852" y="374" text-anchor="middle" font-family="serif" font-size="21" fill="#111">If f mod r ≠ 0 and</text>
  <text x="852" y="397" text-anchor="middle" font-family="serif" font-size="21" font-style="italic" fill="#111">
    a(f) ∈ h<tspan baseline-shift="sub" font-size="14">a</tspan>
  </text>
</svg>