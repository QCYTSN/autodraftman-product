<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="528" viewBox="0 0 1176 528">
  <title>Lottery ticket sparse training and activation matching workflow diagram</title>
  <desc>
    Inventory and relationships: the figure is a white-background workflow. On the left, an initial dense model W_A at t=0 trains downward to W_A at t=T, is pruned downward to W_A at t=T masked by m_A, and is activation-matched rightward to W_B at t=T approximately pi(W_A at t=T). In the center/top, an initial dense W_B at t=0 receives a training relation from W_A and branches by training to W_B at t=T, downward to a sparse-training naive masked W_B, and diagonally to a permuted masked W_B. A dotted blue sparse-training frame encloses three vertical columns: red naive LTH problem, green permuted solution, and green LTH solution. The upper-right W_A masked-at-k box is reached by a gray mask arrow from above and trains downward to the LTH solution. A legend at upper right shows solid train, dashed mask, and dash-dot match line styles. Section symmetry: the sparse training panel is arranged as three nearly equally spaced vertical columns sharing aligned upper boxes, arrows, lower boxes, and captions; the left block is vertically aligned around a common center line with an activation-matching branch to the right.
  </desc>

  <defs>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="20" viewBox="0 0 10 8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#9a9a9a" id="plus_node_0" />
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="20" viewBox="0 0 10 8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8bc078" id="plus_node_1" />
    </marker>
    <marker id="arrow-red" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="20" viewBox="0 0 10 8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#e46166" id="plus_node_2" />
    </marker>
  </defs>

