<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="528" viewBox="0 0 1176 528">
  <title>Lottery ticket sparse training comparison diagram</title>
  <desc>
    Inventory: left block contains initialization w_A at t=0, train arrow to w_A at t=T, prune arrow to masked w_A, and an activation-matching dashed path to w_B approximately pi(w_A). Center/top contains w_B at t=0 with train arrows to dense w_B at t=T, masked w_B with m_A, and permuted-mask w_B with pi(m_A). Right dotted Sparse Training frame contains three top sparse-training sources and three bottom outcomes, with red naive LTH problem and green permuted/LTH solutions. Symmetry/equipartition basis: the three sparse columns inside the blue frame are horizontally equipartitioned with vertical arrows from top to bottom; the two initial networks along the top are aligned on a common baseline; left pruning stack is vertically aligned.
  </desc>

  <defs>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#969696" id="plus_node_0" />
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8cc276" id="plus_node_1" />
    </marker>
    <marker id="arrow-red" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e7666d" id="plus_node_2" />
    </marker>
    <style>
      .label{font-family:Arial, Helvetica, sans-serif; fill:#4b4b4b;}
      .math{font-family:"Times New Roman", Times, serif; fill:#5a5a5a;}
      .mathw{font-family:"Times New Roman", Times, serif; font-weight:700; fill:#555;}
      .subsup{font-family:"Times New Roman", Times, serif; font-style:italic; fill:#686868;}
    </style>
  </defs>

  <rect x="0" y="0" width="1176" height="528" fill="#ffffff" id="plus_node_3" />

  
