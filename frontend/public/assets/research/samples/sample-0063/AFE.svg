      .green{stroke:#5aa04d;fill:#d1e0df}
      .rednode{stroke:#ff1111;fill:#f7caca}
      .graynode{stroke:#9d9d9d;fill:#eeeeee}
      .sans{font-family:Arial, Helvetica, sans-serif;fill:#000}
      .math{font-family:"Times New Roman", Times, serif;fill:#000;font-style:italic}
      .upright{font-style:normal}
      .box{fill:none;stroke:#000;stroke-width:5}
