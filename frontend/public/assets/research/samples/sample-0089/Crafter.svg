    <path d="M950 202 H965 V306 H950"/>

    <path d="M997 202 H982 V306 H997"/>
    <path d="M1131 202 H1146 V306 H1131"/>
  </g>

  <!-- Top text -->
  <g font-family="sans-serif" font-size="32" fill="#000000">
    <text x="98" y="241">K: &lt;start&gt;</text>
    <text x="98" y="283">V: Hello</text>

    <text x="282" y="241">K: Hello</text>
    <text x="282" y="283">V: 11</text>

    <text x="516" y="241">K: 11</text>
    <text x="516" y="283">V: Goodbye</text>

    <text x="765" y="241">K: Goodbye</text>
    <text x="765" y="283">V: 77</text>

    <text x="1012" y="283">Q: Hello</text>
  </g>

  <!-- Bottom brackets -->
  <g fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M81 403 H66 V464 H81"/>
    <path d="M205 403 H220 V464 H205"/>

    <path d="M263 403 H248 V464 H263"/>
    <path d="M456 403 H471 V464 H456"/>

    <path d="M510 403 H495 V464 H510"/>
    <path d="M703 403 H718 V464 H703"/>

    <path d="M748 403 H733 V464 H748"/>
    <path d="M944 403 H959 V464 H944"/>

    <path d="M997 403 H982 V464 H997"/>
    <path d="M1133 403 H1148 V464 H1133"/>
  </g>

  <!-- Bottom token text -->
  <g font-family="sans-serif" font-size="33" fill="#000000">
    <text x="99" y="442">Hello</text>
    <text x="337" y="442">11</text>
    <text x="563" y="442">Goodbye</text>
    <text x="800" y="442">77</text>
