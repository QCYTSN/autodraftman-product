    <text x="345" y="487">y¹</text>
    <text x="612" y="487">x²</text>
    <text x="812" y="487">y²</text>
    <text x="1067" y="487">x*</text>
  </g>

  <!-- Black curved output arrow -->
  <path d="M447 252 C451 202 460 143 503 127 C590 93 771 116 943 109 C1041 105 1076 98 1085 22" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowBlack)"/>
