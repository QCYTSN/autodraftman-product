<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1233 510" width="1233" height="510">
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b7134"/>
    </marker>
    <marker id="arrowBlack" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1233" height="510" fill="#ffffff"/>

  <rect x="45" y="81" width="1130" height="101" fill="#c6d9ef"/>
  <rect x="45" y="320" width="1122" height="76" fill="#c6d9ef"/>

  <!-- Green dashed layer-1 connectors, placed behind title text and aligned to bracket centers -->
  <g fill="none" stroke="#5b7134" stroke-width="4" stroke-dasharray="8 5" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M132 381 V405" marker-end="url(#arrowGreen)"/>
    <path d="M132 381 H341 V405" marker-end="url(#arrowGreen)"/>

    <path d="M368 381 V405" marker-end="url(#arrowGreen)"/>
    <path d="M368 381 H580 V405" marker-end="url(#arrowGreen)"/>

    <path d="M622 381 V405" marker-end="url(#arrowGreen)"/>
    <path d="M622 381 H834 V405" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- Green dashed layer-2 connector -->
  <path d="M1071 202 V160 H335 V193" fill="none" stroke="#5b7134" stroke-width="4" stroke-dasharray="8 5" stroke-linecap="butt" stroke-linejoin="miter" marker-end="url(#arrowGreen)"/>

  <text x="66" y="144" font-family="sans-serif" font-size="35" fill="#000000">Layer 2: Copy value using context similarity based attention</text>
  <text x="66" y="370" font-family="sans-serif" font-size="31.5" fill="#000000">Layer 1: Context formed with previous token using position based attention</text>

  <!-- Top brackets -->
  <g fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M81 202 H66 V306 H81"/>
    <path d="M209 202 H224 V306 H209"/>

