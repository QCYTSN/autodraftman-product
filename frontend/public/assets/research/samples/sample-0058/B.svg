    <text id="dec_label_s1" class="label" x="1270" y="203">s1</text>
    <text id="dec_label_s2" class="label" x="1270" y="244">s2</text>
    <text id="dec_label_silence" class="italic" x="1323" y="224">Silence</text>

    <text id="dec_label_s3" class="label" x="1270" y="286">s3</text>
    <text id="dec_label_s4" class="label" x="1270" y="328">s4</text>
    <text id="dec_label_s5" class="label" x="1270" y="369">s5</text>
    <text id="dec_label_spoken1a" class="italic" x="1318" y="309">spoken</text>
