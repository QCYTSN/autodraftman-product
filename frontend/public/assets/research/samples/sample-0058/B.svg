    <path id="right_arrow_s6_to_low_latent" d="M958 448 L887 288" class="solidLine" marker-end="url(#arrowEnd)" />
  </g>

  
  <g id="patch_decoder_content">
    <desc>The patch decoder is a tall light blue rectangle. Output tokens appear in a vertical list at its right with text-token, silence, spoken word 1, and spoken word 2 group labels.</desc>
    <text id="patch_decoder_text1" class="centerText" x="1144.5" y="251">Patch</text>
    <text id="patch_decoder_text2" class="centerText" x="1144.5" y="279">Decoder</text>
  </g>

  
  <g id="decoder_output_tokens">
    <rect id="dec_tok_better" class="token" x="1205" y="50" width="39" height="19" rx="3" fill="#dcefdc" />
    <rect id="dec_tok_text" class="token" x="1205" y="96" width="39" height="19" rx="3" fill="#dcefdc" />
    <rect id="dec_tok_to" class="token" x="1205" y="141" width="39" height="19" rx="3" fill="#dcefdc" />
