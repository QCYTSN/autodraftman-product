<svg xmlns="http://www.w3.org/2000/svg" width="1455" height="519" viewBox="0 0 1455 519">
  <title>Patch encoder latent speech-text transformer patch decoder diagram</title>
  <desc>
    The figure shows HuBERT token inputs at left, with four green text tokens above a dashed silence/spoken-word boundary and peach speech tokens below. Dashed correspondence lines lead to four green tokens, a patch encoder converts speech tokens into yellow latent representation blocks, and two blue latent boxes connect toward the center. A rounded latent speech-text transformer sits centrally. On its right a left column of green/blue tokens receives arrows from a dashed right token column containing green and peach tokens; lower peach tokens also connect diagonally to blue latent tokens. A long skip arrow runs from the bottom of the left HuBERT token frame to the lower right token column. At far right, a patch decoder produces text and speech token outputs with dashed horizontal word/silence separators.
  </desc>

  <defs>
    <marker id="arrowEnd" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000" id="plus_node_0" />
    </marker>
    <style>
      .label{font-family:Arial, Helvetica, sans-serif;font-size:24px;fill:#000}
      .smallLabel{font-family:Arial, Helvetica, sans-serif;font-size:23px;fill:#000}
      .centerText{font-family:Arial, Helvetica, sans-serif;font-size:24px;fill:#000;text-anchor:middle}
      .italic{font-family:Arial, Helvetica, sans-serif;font-size:24px;font-style:italic;fill:#000}
      .gray{fill:#777}
      .dashLine{stroke:#000;stroke-width:2;stroke-dasharray:15 15;fill:none}
      .solidLine{stroke:#000;stroke-width:2;fill:none}
      .token{stroke:#000;stroke-width:2}
    </style>
  </defs>

  <rect id="background" x="0" y="0" width="1455" height="519" fill="#fff" />

  
  <rect id="f01_left_hubert_token_frame" data-plus-kind="frame" x="164" y="35" width="62" height="420" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6 6" />
  <rect id="f02_patch_encoder_frame" data-plus-kind="frame" x="253" y="221" width="103" height="200" fill="#d8e7fb" stroke="#000" stroke-width="2" />
  <rect id="f03_latent_top_frame" data-plus-kind="frame" x="386" y="219" width="55" height="67" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" />
  <rect id="f04_latent_bottom_frame" data-plus-kind="frame" x="386" y="300" width="55" height="121" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" />
  <rect id="f05_transformer_frame" data-plus-kind="frame" x="652" y="20" width="160" height="305" rx="22" ry="22" fill="#dceced" stroke="#000" stroke-width="4" />
  <rect id="f06_right_context_token_frame" data-plus-kind="frame" x="942" y="40" width="62" height="422" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6 6" />
  <rect id="f07_patch_decoder_frame" data-plus-kind="frame" x="1093" y="40" width="103" height="435" fill="#d8e7fb" stroke="#000" stroke-width="2" />

  
  <path id="left_silence_spoken_separator" d="M9 301 H235" class="dashLine" />
  <path id="right_silence_separator" d="M1203 260 H1425" class="dashLine" />
  <path id="right_word_separator" d="M1203 384 H1425" class="dashLine" />

  
  <g id="left_input_labels">
    <text id="left_label_better" class="label" x="64" y="70">Better</text>
    <text id="left_label_text" class="label" x="68" y="115">_text</text>
    <text id="left_label_to" class="label" x="78" y="159">_to</text>
    <text id="left_label_speech" class="label" x="49" y="204">_speech</text>
    <text id="left_label_silence" class="italic" x="30" y="260">Silence</text>
    <text id="left_label_s1" class="label" x="119" y="244">s1</text>
    <text id="left_label_s2" class="label" x="119" y="288">s2</text>
    <text id="left_label_spoken" class="italic" x="30" y="349">spoken</text>
    <text id="left_label_word1" class="italic" x="30" y="377">word 1</text>
    <text id="left_label_s3" class="label" x="119" y="327">s3</text>
    <text id="left_label_s4" class="label" x="119" y="371">s4</text>
    <text id="left_label_s5" class="label" x="119" y="415">s5</text>
    <text id="left_label_hubert1" class="label gray" x="72" y="443">HuBERT</text>
    <text id="left_label_hubert2" class="label gray" x="80" y="470">Tokens</text>
  </g>

  
  <g id="left_hubert_tokens">
    <desc>Four green text tokens are vertically stacked inside the dashed HuBERT frame, followed by two silence speech tokens and three spoken-word tokens.</desc>
    <rect id="left_tok_better" class="token" x="176" y="52" width="39" height="20" rx="3" fill="#dcefdc" />
    <rect id="left_tok_text" class="token" x="176" y="98" width="39" height="20" rx="3" fill="#dcefdc" />
    <rect id="left_tok_to" class="token" x="176" y="143" width="39" height="20" rx="3" fill="#dcefdc" />
    <rect id="left_tok_speech" class="token" x="176" y="188" width="39" height="20" rx="3" fill="#dcefdc" />
    <rect id="left_tok_s1" class="token" x="176" y="228" width="39" height="20" rx="3" fill="#fee7c9" />
    <rect id="left_tok_s2" class="token" x="176" y="270" width="39" height="20" rx="3" fill="#fee7c9" />
    <rect id="left_tok_s3" class="token" x="176" y="310" width="39" height="20" rx="3" fill="#fee7c9" />
    <rect id="left_tok_s4" class="token" x="176" y="353" width="39" height="20" rx="3" fill="#fee7c9" />
    <rect id="left_tok_s5" class="token" x="176" y="395" width="39" height="20" rx="3" fill="#fee7c9" />
  </g>

  
  <g id="left_text_correspondence">
    <desc>Each of the four top HuBERT text tokens connects horizontally by a dashed line to a corresponding green token just before the central model.</desc>
    <path id="dash_better_to_mid" d="M241 62 H562" class="dashLine" />
    <path id="dash_text_to_mid" d="M241 107 H562" class="dashLine" />
    <path id="dash_to_to_mid" d="M241 152 H562" class="dashLine" />
    <path id="dash_speech_to_mid" d="M241 197 H562" class="dashLine" />
    <rect id="mid_green_better" class="token" x="562" y="52" width="38" height="20" rx="3" fill="#dcefdc" />
    <rect id="mid_green_text" class="token" x="562" y="97" width="38" height="20" rx="3" fill="#dcefdc" />
    <rect id="mid_green_to" class="token" x="562" y="143" width="38" height="20" rx="3" fill="#dcefdc" />
    <rect id="mid_green_speech" class="token" x="562" y="188" width="38" height="20" rx="3" fill="#dcefdc" />
  </g>

  
  <g id="patch_encoder_content">
    <desc>The patch encoder is a light blue rectangle to the right of the left token frame, centered vertically on the speech-token area.</desc>
    <text id="patch_encoder_text1" class="centerText" x="304.5" y="314">Patch</text>
    <text id="patch_encoder_text2" class="centerText" x="304.5" y="342">Encoder</text>
  </g>

  
  <g id="latent_representation_blocks">
    <desc>Two rounded white latent-representation subframes contain pale yellow patch boxes; the upper stack has two boxes and the lower stack has three boxes.</desc>
    <rect id="latent_top_box1" class="token" x="393" y="229" width="39" height="20" rx="3" fill="#fff4d2" />
    <rect id="latent_top_box2" class="token" x="393" y="265" width="39" height="20" rx="3" fill="#fff4d2" />
    <rect id="latent_bottom_box1" class="token" x="393" y="311" width="39" height="20" rx="3" fill="#fff4d2" />
    <rect id="latent_bottom_box2" class="token" x="393" y="353" width="39" height="20" rx="3" fill="#fff4d2" />
    <rect id="latent_bottom_box3" class="token" x="393" y="395" width="39" height="20" rx="3" fill="#fff4d2" />
    <text id="latent_representation_label1" class="label gray" x="550" y="359">Latent</text>
    <text id="latent_representation_label2" class="label gray" x="505" y="386">Representation</text>
  </g>

  
  <g id="latent_links_left_to_center">
    <path id="latent_link_upper" d="M441 260 L562 242" class="solidLine" />
    <path id="latent_link_lower" d="M441 361 L562 287" class="solidLine" />
    <rect id="latent_blue_upper" class="token" x="562" y="232" width="38" height="19" rx="3" fill="#d9e8fb" />
    <rect id="latent_blue_lower" class="token" x="562" y="278" width="38" height="18" rx="3" fill="#d9e8fb" />
  </g>

  
  <path id="bottom_skip_arrow" d="M195 455 V499 H973 V464" class="solidLine" marker-end="url(#arrowEnd)" />

  
  <g id="transformer_content">
    <desc>The large rounded central module is the latent speech-text transformer, filled pale green-blue and outlined with a thick black stroke.</desc>
    <text id="transformer_text1" class="centerText" x="732" y="153">Latent</text>
    <text id="transformer_text2" class="centerText" x="732" y="180">Speech-Text</text>
    <text id="transformer_text3" class="centerText" x="732" y="208">Transformer</text>
  </g>

  
  <g id="right_context_labels">
    <text id="right_ctx_better" class="label" x="1012" y="68">Better</text>
    <text id="right_ctx_text" class="label" x="1017" y="112">_text</text>
    <text id="right_ctx_to" class="label" x="1027" y="157">_to</text>
    <text id="right_ctx_speech" class="label" x="1007" y="202">_speech</text>
    <text id="right_ctx_s1" class="label" x="1015" y="242">s1</text>
    <text id="right_ctx_s2" class="label" x="1015" y="286">s2</text>
    <text id="right_ctx_s3" class="label" x="1015" y="326">s3</text>
    <text id="right_ctx_s4" class="label" x="1015" y="370">s4</text>
    <text id="right_ctx_s5" class="label" x="1015" y="413">s5</text>
    <text id="right_ctx_s6" class="label" x="1015" y="454">s6</text>
  </g>

  
  <g id="right_transformer_token_flow">
    <desc>To the right of the transformer, a left column of green and blue tokens receives arrows from the dashed context-token frame. Top text rows are horizontal; lower speech rows form a fan of diagonal arrows into blue latent tokens.</desc>

    
    <rect id="right_left_green_better" class="token" x="845" y="50" width="38" height="19" rx="3" fill="#dcefdc" />
    <rect id="right_left_green_text" class="token" x="845" y="96" width="38" height="19" rx="3" fill="#dcefdc" />
    <rect id="right_left_green_to" class="token" x="845" y="141" width="38" height="19" rx="3" fill="#dcefdc" />
    <rect id="right_left_blue_speech" class="token" x="845" y="186" width="38" height="19" rx="3" fill="#d9e8fb" />
    <rect id="right_left_blue_mid" class="token" x="845" y="231" width="38" height="18" rx="3" fill="#d9e8fb" />
    <rect id="right_left_blue_low" class="token" x="845" y="276" width="38" height="19" rx="3" fill="#d9e8fb" />

    
    <rect id="right_ctx_tok_better" class="token" x="958" y="50" width="38" height="19" rx="3" fill="#dcefdc" />
    <rect id="right_ctx_tok_text" class="token" x="958" y="96" width="38" height="19" rx="3" fill="#dcefdc" />
    <rect id="right_ctx_tok_to" class="token" x="958" y="141" width="38" height="19" rx="3" fill="#dcefdc" />
    <rect id="right_ctx_tok_speech" class="token" x="958" y="187" width="38" height="19" rx="3" fill="#dcefdc" />
    <rect id="right_ctx_tok_s1" class="token" x="958" y="226" width="38" height="20" rx="3" fill="#fee7c9" />
    <rect id="right_ctx_tok_s2" class="token" x="958" y="269" width="38" height="20" rx="3" fill="#fee7c9" />
    <rect id="right_ctx_tok_s3" class="token" x="958" y="310" width="38" height="20" rx="3" fill="#fee7c9" />
    <rect id="right_ctx_tok_s4" class="token" x="958" y="354" width="38" height="20" rx="3" fill="#fee7c9" />
    <rect id="right_ctx_tok_s5" class="token" x="958" y="396" width="38" height="20" rx="3" fill="#fee7c9" />
    <rect id="right_ctx_tok_s6" class="token" x="958" y="438" width="38" height="20" rx="3" fill="#fee7c9" />

    
    <path id="right_arrow_better" d="M958 59 L886 59" class="solidLine" marker-end="url(#arrowEnd)" />
    <path id="right_arrow_text" d="M958 105 L886 105" class="solidLine" marker-end="url(#arrowEnd)" />
    <path id="right_arrow_to" d="M958 150 L886 150" class="solidLine" marker-end="url(#arrowEnd)" />
    <path id="right_arrow_speech" d="M958 196 L886 196" class="solidLine" marker-end="url(#arrowEnd)" />

    
    <path id="right_arrow_s1_to_speech_latent" d="M958 236 L886 196" class="solidLine" marker-end="url(#arrowEnd)" />
    <path id="right_arrow_s2_to_mid_latent" d="M958 279 L886 241" class="solidLine" marker-end="url(#arrowEnd)" />
    <path id="right_arrow_s3_to_low_latent" d="M958 320 L886 286" class="solidLine" marker-end="url(#arrowEnd)" />
    <path id="right_arrow_s4_to_low_latent" d="M958 364 L888 287" class="solidLine" marker-end="url(#arrowEnd)" />
