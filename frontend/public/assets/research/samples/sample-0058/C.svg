      .paleYellow{fill:#fff4cf; stroke:#000; stroke-width:2;}
      .blueBox{fill:#d9e8ff; stroke:#000; stroke-width:2;}
      .modelFill{fill:#d9eaea; stroke:#000; stroke-width:4;}
      .dash{stroke:#000; stroke-width:2; stroke-dasharray:8 7; fill:none;}
      .line{stroke:#000; stroke-width:2; fill:none;}
      .thin{stroke-width:1.9;}
    </style>
