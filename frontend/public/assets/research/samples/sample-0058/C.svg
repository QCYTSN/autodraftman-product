<svg xmlns="http://www.w3.org/2000/svg" width="1455" height="519" viewBox="0 0 1455 519">
  <title>Latent Speech-Text Transformer architecture diagram</title>
  <desc>
    Inventory and relationships: The full figure is a left-to-right model diagram. At the far left, a dashed HuBERT-token column contains four green text-token boxes, two pale-yellow silence boxes, and three pale-yellow spoken-word boxes, separated by a horizontal dashed boundary. The text-token boxes connect by dashed horizontal lines to matching green latent boxes near the encoder side. A blue Patch Encoder block sits below the dashed text lines. A small rounded latent-token stack lies to the right of the encoder and connects by solid slanted lines to two blue latent representation boxes. A central rounded Latent Speech-Text Transformer block receives/outputs representations. On its right, a column of left-side predicted boxes receives arrows from a dashed target-token column containing green text boxes and yellow speech boxes; several arrows are diagonal to blue latent boxes. A long bottom arrow carries information from the left HuBERT-token column to the bottom of the target-token column. On the far right, a blue Patch Decoder block maps to output token boxes and labels for text, silence, spoken word 1, and spoken word 2. Symmetry/equipartition basis: token boxes in each vertical token column are evenly spaced by sequence order, while model blocks are horizontally aligned in a left-to-right pipeline.
  </desc>

  <defs>
    <marker id="arrowHeadBlack" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" viewBox="0 0 10 8" refX="0" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000000" id="plus_node_0" />
    </marker>
    <marker id="arrowHeadBlackStart" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" viewBox="0 0 10 8" refX="0" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000000" id="plus_node_1" />
    </marker>
