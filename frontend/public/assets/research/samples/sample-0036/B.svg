      <ellipse cx="87" cy="133" rx="24" ry="9" fill="#73bdf1" id="plus_node_12" />
      <path d="M63 146 C63 153 111 153 111 146" fill="none" id="plus_node_13" />
      <path d="M63 160 C63 167 111 167 111 160" fill="none" id="plus_node_14" />
      <path d="M63 174 C63 181 111 181 111 174" fill="none" id="plus_node_15" />
      <path d="M71 145 C77 148 97 149 105 145" fill="none" stroke-width="3" id="plus_node_16" />
      <path d="M72 159 C80 162 96 163 104 159" fill="none" stroke-width="3" id="plus_node_17" />
      <path d="M73 174 C81 177 96 177 103 174" fill="none" stroke-width="3" id="plus_node_18" />
      <path d="M73 188 C80 191 96 192 103 188" fill="none" stroke-width="3" id="plus_node_19" />
    </g>
    <text id="txt-data-pool" class="hand label" x="56" y="232">Data Pool</text>
  </g>

  
  <path id="arrow-data-to-hard" class="line" d="M131 154 H235" marker-end="url(#arrowEnd)" />
  <text id="txt-times-eight" class="hand small" x="203" y="124">×8</text>
