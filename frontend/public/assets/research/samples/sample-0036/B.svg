  <g id="llm-panel">
    <rect id="llm-panel-bg" x="407" y="80" width="113" height="149" rx="4" fill="#edf8fb" />
    <g id="llm-star" transform="translate(419 88)"><path id="repair-star-yellow" d="M14 18 C9 16 5 16 0 18 C7 20 11 24 14 35 C13 27 13 22 14 18 Z" fill="#fbbc05" /><path id="repair-star-green" d="M14 18 C15 23 16 28 14 35 C17 26 21 21 31 18 C23 19 18 19 14 18 Z" fill="#34a853" /><path id="repair-star-blue" d="M14 18 C19 17 24 17 31 18 C21 15 17 11 14 0 C15 8 15 13 14 18 Z" fill="#4285f4" /><path id="repair-star-red" d="M14 18 C13 13 13 8 14 0 C11 10 7 15 0 18 C6 17 10 17 14 18 Z" fill="#ea4335" /></g><text id="txt-llm" class="hand label" x="457" y="112">LLM</text>

    <g id="llm-rotate" transform="translate(447 127)" stroke="#2d2e3a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
