<svg xmlns="http://www.w3.org/2000/svg" width="1017" height="254" viewBox="0 0 1017 254">
  <title>Data Mining to Trajectory Synthesis to Quality Verification Pipeline</title>
  <desc>
    Inventory: three top chevron section banners labeled Data Mining, Trajectory Synthesis, and Quality Verification.
    Data Mining contains a Data Pool database with document icons, an arrow labeled x8 and success epsilon-less-than-one to a Hard QA Pairs database, then a Query arrow to the synthesis block.
    Trajectory Synthesis contains an LLM/tool-set panel, three generated action/info rows, a legend, and a ChatGPT-like synthesis icon.
    Quality Verification contains three dashed checklist panels with green checks, then an arrow to a Cold-start Data database with a green success check badge.
    Symmetry/equipartition: the global layout is a left-to-right pipeline with three aligned horizontal sections; repeated output rows are vertically equipartitioned.
  </desc>

  <defs>
    <marker id="arrowEnd" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" viewBox="0 0 12 10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111" id="plus_node_0" />
    </marker>
    <marker id="smallArrowEnd" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" viewBox="0 0 9 8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#111" id="plus_node_1" />
    </marker>

    <linearGradient id="dbBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb7e2" />
      <stop offset="0.45" stop-color="#647aa9" />
      <stop offset="1" stop-color="#445071" />
    </linearGradient>

    <style>
      .hand { font-family: "Comic Sans MS","Comic Neue","Trebuchet MS",cursive,sans-serif; fill:#000; }
      .label { font-size:22px; font-weight:600; }
      .small { font-size:17px; font-weight:600; }
      .tiny { font-size:12px; font-weight:700; }
      .line { stroke:#111; stroke-width:2.8; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .dash { stroke:#000; stroke-width:2.6; stroke-dasharray:9 7; fill:none; stroke-linecap:square; }
      .thin { stroke:#111; stroke-width:2.1; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  
  <rect id="f01" data-plus-kind="frame" x="0" y="0" width="1017" height="254" fill="#ffffff" stroke="none" />
  <rect id="f02" data-plus-kind="frame" x="374" y="78" width="337" height="158" fill="none" stroke="none" />
  <rect id="f03" data-plus-kind="frame" x="733" y="78" width="262" height="158" fill="none" stroke="none" />
  <path id="f04-header-data-mining" data-plus-kind="frame" d="M77 22 H303 V2 L342 41 L303 80 V60 H77 L116 41 Z" fill="#fdebe1" stroke="none" />
  <path id="f05-header-trajectory" data-plus-kind="frame" d="M374 22 H599 V2 L638 41 L599 80 V60 H374 L413 41 Z" fill="#eaf7fb" stroke="none" />
  <path id="f06-header-quality" data-plus-kind="frame" d="M664 22 H889 V2 L928 41 L889 80 V60 H664 L703 41 Z" fill="#dff2d8" stroke="none" />

  
  <text id="txt-header-data" class="hand label" x="153" y="48">Data Mining</text>
  <text id="txt-header-traj" class="hand label" x="406" y="48">Trajectory Synthesis</text>
  <text id="txt-header-quality" class="hand label" x="702" y="48">Quality Verification</text>

  
  <g id="data-pool-block">
    <g id="data-pool-docs" stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M38 88 H59 L66 95 V123 H38 Z" fill="#ffd576" id="plus_node_2" />
      <path d="M75 83 H94 L101 90 V120 H75 Z" fill="#ffd576" id="plus_node_3" />
