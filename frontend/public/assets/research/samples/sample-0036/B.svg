      <line x1="82" y1="96" x2="92" y2="96" stroke="#222" stroke-width="3" id="plus_node_6" />
      <line x1="118" y1="100" x2="128" y2="100" stroke="#222" stroke-width="3" id="plus_node_7" />
      <line x1="66" y1="123" x2="66" y2="133" stroke="#222" id="plus_node_8" />
