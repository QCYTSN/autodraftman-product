    <rect id="toolset-dashed-frame" x="418" y="158" width="91" height="67" fill="#f6fbfd" stroke="#000" stroke-width="2.2" stroke-dasharray="7 6" />
    <g id="tool-icons"><g id="google-icon" transform="translate(425 166)"><circle id="repair-google-bg" cx="10" cy="10" r="10" fill="#fff" /><path id="repair-google-red" d="M10 0 A10 10 0 0 1 18.2 4.3 L15.2 7.1 A6 6 0 0 0 10 4 Z" fill="#ea4335" /><path id="repair-google-yellow" d="M1.8 4.2 A10 10 0 0 1 10 0 V4 A6 6 0 0 0 4.7 7.2 Z" fill="#fbbc05" /><path id="repair-google-green" d="M4.7 12.8 A6 6 0 0 0 14.2 14.5 L17.1 17.4 A10 10 0 0 1 1.8 15.8 Z" fill="#34a853" /><path id="repair-google-blue" d="M10 8 H20 A10 10 0 0 1 17.1 17.4 L14.2 14.5 A6 6 0 0 0 15.5 12 H10 Z" fill="#4285f4" /></g><g id="browser-icon" transform="translate(456 166)"><rect id="repair-search-page" x="0" y="0" width="22" height="18" fill="#eaf3ff" stroke="#6b7c93" stroke-width="1.3" /><rect id="repair-search-bar" x="0" y="0" width="22" height="5" fill="#9fd1f0" /><rect id="repair-search-chip1" x="3" y="8" width="7" height="5" fill="#fbbc05" opacity="0.85" /><rect id="repair-search-chip2" x="3" y="13" width="8" height="3" fill="#4285f4" opacity="0.75" /><circle id="repair-search-lens" cx="15" cy="12" r="5" fill="none" stroke="#ed5676" stroke-width="2" /><line id="repair-search-handle" x1="18.5" y1="15.5" x2="21" y2="18" stroke="#5b7bbd" stroke-width="1.7" stroke-linecap="round" /></g><g id="image-icon" transform="translate(486 166)"><rect id="repair-image-select" x="-2" y="-2" width="22" height="22" fill="none" stroke="#6b7c93" stroke-width="1.1" stroke-dasharray="2 2" /><rect id="repair-image-frame" x="0" y="0" width="18" height="18" fill="#eaf3ff" stroke="#6b7c93" stroke-width="1.3" /><path id="repair-image-mountains" d="M2 15 L7 9 L11 13 L14 8 L17 15 Z" fill="#5d84bd" /><circle id="repair-image-sun" cx="14" cy="4" r="2" fill="#e64949" /><rect id="repair-image-handle-tl" x="-3" y="-3" width="3" height="3" fill="#e64949" /><rect id="repair-image-handle-tr" x="18" y="-3" width="3" height="3" fill="#e64949" /><rect id="repair-image-handle-br" x="18" y="18" width="3" height="3" fill="#e64949" /></g><text id="tool-vertical-dots" class="hand small" x="508" y="180">⋮</text><text id="txt-tool-set" class="hand label" x="432" y="217">Tool set</text></g></g>

  
