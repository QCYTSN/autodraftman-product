<svg xmlns="http://www.w3.org/2000/svg" width="1653" height="585" viewBox="0 0 1653 585">
  <title>Environment to valid solution constraints and solutions polytope</title>
  <desc>Complete native SVG reconstruction. Base frames divide the environment icon and task reward, the central all-solutions/valid-solutions constraint geometry, and the right solutions polytope with policies. No SAM assets were supplied, so all visible content is constructed as editable SVG.</desc>

  <defs>
    <marker id="arrowBlack" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" viewBox="0 0 14 12" refX="13" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 Z" fill="#000" id="plus_node_0" />
    </marker>
    <marker id="arrowBlackSmall" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" viewBox="0 0 11 9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#000" id="plus_node_1" />
    </marker>
    <marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="31" markerHeight="59" viewBox="0 0 31 59" refX="31" refY="29.5" orient="auto">
      <path d="M0,0 L31,29.5 L0,59 Z" fill="#ef6f2d" id="plus_node_2" />
    </marker>
    <marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="13" viewBox="0 0 17 13" refX="16" refY="6.5" orient="auto">
      <path d="M0,0 L17,6.5 L0,13 Z" fill="#e00000" id="plus_node_3" />
    </marker>
    <marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" viewBox="0 0 13 10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 Z" fill="#0e6485" id="plus_node_4" />
    </marker>
  </defs>

  
  <rect id="f00" data-plus-kind="frame" x="0" y="0" width="1653" height="585" fill="#ffffff" stroke="none" />
  <rect id="f01" data-plus-kind="frame" x="20" y="145" width="470" height="335" fill="none" stroke="none" />
  <rect id="f02" data-plus-kind="frame" x="590" y="12" width="468" height="540" fill="none" stroke="none" />
  <rect id="f03" data-plus-kind="frame" x="1128" y="132" width="365" height="430" fill="none" stroke="none" />
  <rect id="f04" data-plus-kind="frame" x="1508" y="213" width="108" height="233" fill="none" stroke="none" />
  <rect id="f05" data-plus-kind="frame" x="495" y="310" width="155" height="65" fill="none" stroke="none" />

  <g id="environment-section">
    <desc>Frame f01 contains the word Environment above a black robot arm, a black work table, and a black cube with white internal edges. The task reward label sits beneath the environment; a red dashed arrow points from the reward text toward the origin/solution point in the center.</desc>
    <text id="txt-environment" x="154" y="186" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#000">Environment</text>

    <g id="robot-arm-icon" fill="#000" stroke="#000">
      <path id="robot-base-body" d="M40,380 L40,323 C42,303 55,287 74,276 L118,240 C123,250 132,258 144,262 L104,313 C90,333 61,336 47,317 L47,380 Z" fill="#000" stroke="none" />
      <rect id="robot-base-foot" x="29" y="393" width="116" height="23" rx="8" fill="#000" stroke="none" />
      <path id="robot-upper-link" d="M89,304 L159,246" fill="none" stroke="#000" stroke-width="34" stroke-linecap="round" />
      <path id="robot-forearm-link" d="M174,251 L221,300" fill="none" stroke="#000" stroke-width="33" stroke-linecap="round" />
      <circle id="robot-shoulder-outer-white" cx="88" cy="305" r="32" fill="#fff" stroke="none" />
      <circle id="robot-shoulder-ring" cx="88" cy="305" r="23" fill="#000" stroke="none" />
      <circle id="robot-shoulder-center" cx="88" cy="305" r="7" fill="#fff" stroke="none" />
      <circle id="robot-elbow-outer-white" cx="159" cy="246" r="24" fill="#fff" stroke="none" />
      <circle id="robot-elbow-ring" cx="159" cy="246" r="17" fill="#000" stroke="none" />
      <circle id="robot-elbow-center" cx="159" cy="246" r="5.5" fill="#fff" stroke="none" />
      <path id="robot-wrist-and-claw" d="M210,299 L231,283 L263,288 L266,322" fill="none" stroke="#000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
      <path id="robot-claw-lower" d="M210,300 L204,313 L210,342 L242,344" fill="none" stroke="#000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <g id="work-table-cube-icon">
      <path id="table-top" d="M303,327 L446,327 L446,356 L303,356 Z" fill="#000" />
      <path id="table-left-leg" d="M340,354 L371,354 L331,472 L289,472 Z" fill="#000" />
      <path id="table-right-leg" d="M386,354 L412,354 L462,472 L431,472 Z" fill="#000" />
      <path id="table-crossbar" d="M261,400 L487,400 L487,415 L261,415 Z" fill="#000" />

      <g id="cube-on-table" stroke="#fff" stroke-width="5" stroke-linejoin="miter">
        <polygon id="cube-front-face" points="331,257 374,282 374,329 331,303" fill="#000" />
        <polygon id="cube-right-face" points="374,282 419,255 419,303 374,329" fill="#000" />
        <polygon id="cube-top-face" points="331,257 374,225 419,255 374,282" fill="#000" />
        <line id="cube-inner-edge" x1="386" y1="274" x2="386" y2="291" stroke="#fff" stroke-width="5" />
      </g>
    </g>

    <text id="txt-task-reward" x="170" y="526" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#000">
      Task Reward: <tspan font-style="italic">r</tspan>
    </text>
  </g>

  <g id="orange-transition-arrow">
    <desc>Frame f05 contains the large orange rightward arrow connecting the environment to the solution-space construction.</desc>
    <line id="arrow-environment-to-center" x1="497" y1="340" x2="645" y2="340" stroke="#ef6f2d" stroke-width="30" marker-end="url(#arrowOrange)" />
  </g>

  <g id="central-constraint-section">
    <desc>Frame f02 contains a skewed gray all-solutions plane with a dotted dark border, black coordinate axes, an orange tilted separating-boundary label and top equation label, a blue valid-solutions polygon, a blue origin/solution point on its lower area, gray dashed projection lines to the right polytope, and a red dashed task-reward vector pointing into the same point. The construction is approximately centrally organized around the valid solution polygon; the skewed plane and tilted text share the same oblique orientation.</desc>

    
    <path id="guide-gray-upper" d="M811,222 L1283,147" fill="none" stroke="#8b8b8b" stroke-width="2.5" stroke-dasharray="11 9" />
    <path id="guide-gray-mid" d="M720,413 L1277,407" fill="none" stroke="#8b8b8b" stroke-width="2.5" stroke-dasharray="11 9" />
    <path id="guide-gray-lower" d="M817,445 L1290,457" fill="none" stroke="#8b8b8b" stroke-width="2.5" stroke-dasharray="11 9" />

    <polygon id="all-solutions-plane" points="628,153 946,80 1037,475 719,549" fill="#d9d9d9" fill-opacity="0.95" stroke="#092637" stroke-width="3" stroke-dasharray="2 4" stroke-linejoin="round" />

    <line id="axis-z-up" x1="794" y1="232" x2="794" y2="16" stroke="#000" stroke-width="3" marker-end="url(#arrowBlackSmall)" />
    <line id="axis-down-left" x1="724" y1="416" x2="600" y2="537" stroke="#000" stroke-width="3" marker-end="url(#arrowBlackSmall)" />
    <line id="axis-down-right" x1="920" y1="401" x2="1145" y2="482" stroke="#000" stroke-width="3" marker-end="url(#arrowBlackSmall)" />

    <text id="txt-phi-top" x="819" y="93" transform="rotate(-13 819 93)" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="700" fill="#c24d00">
      Φw + b
    </text>
    <text id="txt-phi-side" x="713" y="383" transform="rotate(-78 713 383)" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#c24d00">
      Φw + b &gt; 0
    </text>

    <text id="txt-all-solutions" x="879" y="142" font-family="Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" fill="#000">
      <tspan x="879" dy="0">All</tspan>
      <tspan x="879" dy="38">Solutions</tspan>
    </text>

    <polygon id="valid-solutions-polytope" points="752,260 811,222 896,235 935,298 920,399 818,445 720,413" fill="#4fb1d8" stroke="#000" stroke-width="5" stroke-linejoin="round" />
    <text id="txt-valid-solutions" x="830" y="318" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#fff">
      <tspan x="830" dy="0">Valid</tspan>
      <tspan x="830" dy="34">Solutions</tspan>
    </text>
    <circle id="central-blue-point" cx="804" cy="415" r="8" fill="#0f6388" stroke="#052638" stroke-width="3" />

    <path id="task-reward-vector" d="M389,520 L804,415" fill="none" stroke="#e00000" stroke-width="2.5" stroke-dasharray="12 8" marker-end="url(#arrowRed)" />
  </g>

  <g id="right-polytope-section">
    <desc>Frame f03 contains a large light-blue solutions polytope with a thick dark-teal border, three teal points corresponding to w1, w2, and the starred solution, dashed teal horizontal arrows running rightward, small italic labels near the top two points, and a bold title below. The three dashed arrows terminate in the policy box in f04 with labels pi1, pi2, and pi-star.</desc>

    <polygon id="solutions-polytope-large" points="1192,200 1283,147 1415,166 1474,254 1453,393 1289,457 1146,413" fill="#c2e8f7" stroke="#0e5d7c" stroke-width="7" stroke-linejoin="round" />

    <path id="white-slash-inside-polytope" d="M1304,291 L1311,299" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.9" />

    <circle id="polytope-point-w1" cx="1228" cy="284" r="7" fill="#2b8ead" stroke="#073047" stroke-width="3" />
    <circle id="polytope-point-w2" cx="1291" cy="350" r="7" fill="#2b8ead" stroke="#073047" stroke-width="3" />
    <circle id="polytope-point-star" cx="1278" cy="406" r="7" fill="#2b8ead" stroke="#073047" stroke-width="3" />

    <text id="txt-w1" x="1233" y="269" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#000">w<tspan baseline-shift="sub" font-size="20">1</tspan></text>
    <text id="txt-w2" x="1297" y="338" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#000">w<tspan baseline-shift="sub" font-size="20">2</tspan></text>

    <text id="txt-solutions-polytope-title" x="1282" y="540" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#000">Solutions Polytope</text>
  </g>

  <g id="policy-box-section">
    <desc>Frame f04 contains a thin dark rectangular policy box with three policy labels aligned with the incoming dashed arrows: pi1, pi2, and pi-star.</desc>
    <rect id="policy-box" x="1509" y="214" width="107" height="231" fill="#f7f7f7" stroke="#092637" stroke-width="3" />
    <text id="txt-pi1" x="1544" y="295" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#000">π<tspan baseline-shift="sub" font-size="20">1</tspan></text>
    <text id="txt-pi2" x="1544" y="361" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#000">π<tspan baseline-shift="sub" font-size="20">2</tspan></text>
    <text id="txt-pistar" x="1544" y="416" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#000">π<tspan baseline-shift="super" font-size="20">*</tspan></text>
  <g id="policy-connector-overlay"><path id="dashed-arrow-w1-to-pi1" d="M1238,284 L1542,284" fill="none" stroke="#0e6485" stroke-width="3" stroke-dasharray="11 9" marker-end="url(#arrowTeal)" /><path id="dashed-arrow-w2-to-pi2" d="M1301,350 L1542,350" fill="none" stroke="#0e6485" stroke-width="3" stroke-dasharray="11 9" marker-end="url(#arrowTeal)" /><path id="dashed-arrow-star-to-pistar" d="M1288,407 L1542,407" fill="none" stroke="#0e6485" stroke-width="3" stroke-dasharray="11 9" marker-end="url(#arrowTeal)" /></g></g>
</svg>