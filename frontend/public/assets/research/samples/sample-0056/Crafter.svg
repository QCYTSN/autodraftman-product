  <path d="M190 237 V279 H291" fill="none" stroke="#000000" stroke-width="1.5"/>
  <path d="M326 279 H439 V237" fill="none" stroke="#000000" stroke-width="1.5"/>
  <rect x="291" y="263" width="35" height="31" fill="#d894cf" stroke="#8c3f91" stroke-width="1.5"/>

  <!-- solid data-flow arrows -->
  <path d="M48 220 H57" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <path d="M153 220 H173" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <path d="M315 220 H367" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <path d="M402 220 H422" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
