  <rect x="818" y="38" width="142" height="82" fill="#f8e3d8" stroke="#e87435" stroke-width="1.5"/>
  <rect x="818" y="178" width="142" height="82" fill="#f8e3d8" stroke="#e87435" stroke-width="1.5"/>
  <rect x="818" y="290" width="142" height="82" fill="#f8e3d8" stroke="#e87435" stroke-width="1.5"/>

