  <path d="M625.5 179 V78 H653" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <path d="M786 78 H818" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <path d="M625.5 259 V315 H818" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>

  <!-- text: side variables -->
