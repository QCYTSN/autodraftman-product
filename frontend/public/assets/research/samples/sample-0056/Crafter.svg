  </text>

  <text x="261" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#000000">Quantizer</text>
  <text x="384.5" y="226" text-anchor="middle" font-family="serif" font-size="20" font-style="italic" fill="#000000">Z</text>
  <text x="308.5" y="286" text-anchor="middle" font-family="serif" font-size="20" font-style="italic" fill="#000000">U</text>

  <text x="538" y="216" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#000000">
    <tspan x="538" dy="0">Decoder</tspan>
    <tspan x="538" dy="1.15em">(</tspan><tspan font-family="serif" font-style="italic">g</tspan><tspan>)</tspan>
  </text>

  <text x="625.5" y="225" text-anchor="middle" font-family="serif" font-size="20" font-style="italic" fill="#000000">Ỹ</text>

  <text x="735" y="216" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#000000">
    <tspan x="735" dy="0">Classifier</tspan>
    <tspan x="735" dy="1.15em">(</tspan><tspan font-family="serif" font-style="italic">c</tspan><tspan>)</tspan>
  </text>

  <text x="807" y="216" text-anchor="middle" font-family="serif" font-size="20" font-style="italic" fill="#000000">Ŝ</text>

  <text x="720" y="76" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#000000">
