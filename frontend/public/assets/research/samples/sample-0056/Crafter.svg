  <text x="190" y="227" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#000000">+</text>
  <text x="439" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#000000">-</text>

  <!-- text: losses -->
  <text x="889" y="74" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#000000">
    <tspan x="889" dy="0">Wasserstein</tspan>
    <tspan x="889" dy="1.15em">Loss</tspan>
  </text>

  <text x="889" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#000000">
    <tspan x="889" dy="0">Classification</tspan>
    <tspan x="889" dy="1.15em">Loss</tspan>
  </text>

  <text x="889" y="327" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#000000">
    <tspan x="889" dy="0">Distortion</tspan>
    <tspan x="889" dy="1.15em">Loss</tspan>
  </text>
</svg>