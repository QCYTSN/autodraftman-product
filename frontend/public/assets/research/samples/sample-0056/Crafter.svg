<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 977 389" width="977" height="389">
  <defs>
    <marker id="arrowBlack" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="977" height="389" fill="#ffffff"/>

  <!-- dashed supervisory / loss connections -->
  <path d="M48 58 H653" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="8 5" marker-end="url(#arrowBlack)"/>
  <path d="M48 139 H891 V178" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="8 5" marker-end="url(#arrowBlack)"/>
  <path d="M34 260 V342 H818" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="8 5" marker-end="url(#arrowBlack)"/>

