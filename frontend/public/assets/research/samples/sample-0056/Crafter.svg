  <rect x="674" y="187" width="122" height="66" fill="#ffec14" stroke="#ff9500" stroke-width="1.5"/>

  <polygon points="653,29 786,53 786,103 653,129" fill="#d6c2e5" stroke="#7d36a6" stroke-width="1.5"/>

