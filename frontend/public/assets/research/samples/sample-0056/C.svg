<svg xmlns="http://www.w3.org/2000/svg" width="977" height="389" viewBox="0 0 977 389">
  <title>Neural compression and adversarial classification block diagram</title>
  <desc>
    Inventory: three left source labels Y, S, X feed the diagram; X flows through Encoder, plus node, Quantizer, Z, minus node, Decoder, reconstructed Y-tilde, Classifier, and Classification Loss. Y also travels by a dashed horizontal reference line to the Discriminator; S travels by a dashed line to Classification Loss; X travels by a dashed lower bypass to Distortion Loss. Y-tilde branches upward to the Discriminator and downward to Distortion Loss. Discriminator feeds Wasserstein Loss. U supplies two upward auxiliary inputs to the plus and minus nodes. Whole section basis: a mostly horizontal left-to-right processing chain with vertical auxiliary branches and right-aligned loss boxes.
  </desc>

  <defs>
    <marker id="arrowBlack" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000000" id="plus_node_0" />
    </marker>
    <marker id="arrowBlackStart" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000000" id="plus_node_1" />
    </marker>
    <clipPath id="topCrop">
      <rect x="0" y="0" width="977" height="5" id="plus_node_2" />
    </clipPath>
  </defs>

  <rect id="f01" data-plus-kind="frame" x="0" y="0" width="977" height="389" fill="#ffffff" stroke="none" />

  
