    <rect id="b-prototype-bank" x="295" y="118" width="235" height="26" rx="2" ry="2" fill="#fee6a8" stroke="#000" stroke-width="1.5" />
    <circle id="b-bank-dot1" cx="303" cy="131" r="4" fill="#2aa8e8" stroke="#000" stroke-width="1" />
    <circle id="b-bank-dot2" cx="313" cy="131" r="4" fill="#fb723d" stroke="#000" stroke-width="1" />
    <circle id="b-bank-dot3" cx="323" cy="131" r="4" fill="#fff7d1" stroke="#000" stroke-width="1" />
    <text id="b-bank-text" class="small" x="334" y="135">Prototype Bank</text>
