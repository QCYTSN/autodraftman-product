    <text id="c-texkd-text" class="small" x="121" y="383">TEXKD</text>
    <path id="c-d1-to-ta" class="line" d="M69 421 V402" marker-end="url(#arrow-black)" />
    <text id="c-d1-text" class="small" x="62" y="432">D₁</text>
    <path id="c-d2-to-ta" class="line" d="M205 421 V402" marker-end="url(#arrow-black)" />
    <text id="c-d2-text" class="small" x="199" y="432">D₂</text>

    <path id="c-et-triangle" d="M185 323 L221 323 L241 357 L165 357 Z" fill="#d9ebf7" stroke="#000" stroke-width="1.5" />
    <text id="c-et-text" class="small" x="197" y="345">E<tspan baseline-shift="sub" font-size="9">T</tspan></text>
    <g id="c-et-snow" transform="translate(219 347)"><path d="M0 -8 V8 M-6.9 -4 L6.9 4 M-6.9 4 L6.9 -4 M-3 -6 L0 -4 L3 -6 M-3 6 L0 4 L3 6 M-7 0 L-4 -1.8 L-4 1.8 M7 0 L4 -1.8 L4 1.8" fill="none" stroke="#35a9e7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><path id="c-ta-to-et" class="line" d="M204 374 V360" marker-end="url(#arrow-black)" />

    
    <path id="c-e1-triangle" d="M334 323 L374 323 L393 357 L315 357 Z" fill="#d9ebf7" stroke="#000" stroke-width="1.5" />
    <text id="c-e1-text" class="small" x="346" y="345">E₁</text>
