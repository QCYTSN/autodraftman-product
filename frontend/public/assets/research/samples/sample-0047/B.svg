    <circle id="b-cent2" cx="460" cy="154" r="3.5" fill="#fff" stroke="#000" stroke-width="1.2" />
    <circle id="b-cent3" cx="474" cy="154" r="3.5" fill="#fff" stroke="#000" stroke-width="1.2" />

    <path id="b-extract-arrow" class="line" d="M335 92 V116" marker-end="url(#arrow-black)" />
    <text id="b-extract-text" class="tiny" x="352" y="108">extract</text>
    <path id="b-retrieval-arrow" class="line" d="M445 117 V94" marker-end="url(#arrow-black)" />
    <text id="b-retrieval-text" class="tiny" x="394" y="108">retrieval</text>
    <path id="b-update-arrow" class="line" d="M473 93 V117" marker-end="url(#arrow-black)" />
    <text id="b-update-text" class="tiny" x="480" y="108">update</text>
  </g>

  
  <g id="panel-c">
    <title>(c) Ours: Prompt-Anchored visual-text Distillation</title>
    <desc>Inventory: large bottom panel with title; shared-space dashed region at top containing prompt anchor dashed box with six star anchors and an align arrow from visual side; two lower dashed subframes, text side on the left and visual side on the right. Text side includes icon label, blue TA-Prompt, red TA-Prompt, TEXKD arrow with snowflake and flame, data labels D1 D2, and a blue encoder triangle E_T. Visual side includes eye icon label, blue encoder E1, red encoder E_t, VISKD arrow with snowflake/flame cues, yellow VA-Prompt Pool, data labels and vertical double-headed links. Basis: lower half split into two aligned columns, each column connected upward to the shared prompt anchors.</desc>
    <rect id="f03" data-plus-kind="frame" x="5" y="174" width="547" height="269" rx="2" ry="2" fill="#fbfbfb" stroke="#000" stroke-width="1.5" />
    <text id="title-c" class="panel-title" x="8" y="191">(c) Ours: Prompt-Anchored visual-text Distillation</text>

