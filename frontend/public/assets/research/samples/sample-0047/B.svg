    <path id="a-store-arrow" class="line" d="M58 93 V125" marker-end="url(#arrow-black)" />
    <text id="a-store-text" class="tiny" x="63" y="115">store</text>
    <path id="a-replay-arrow" class="line" d="M135 126 V95" marker-end="url(#arrow-black)" />
    <text id="a-replay-text" class="tiny" x="92" y="114">replay</text>
    <path id="a-update-arrow" class="line" d="M145 94 V126" marker-end="url(#arrow-black)" />
    <text id="a-update-text" class="tiny" x="146" y="114">update</text>
    <path id="a-model3-down" class="line" d="M207 93 V126" marker-end="url(#arrow-black)" />
    <path id="a-model3-up" class="line" d="M220 126 V95" marker-end="url(#arrow-black)" />
  </g>

  
  <g id="panel-b">
    <title>(b) Prototype-based Methods</title>
    <desc>Inventory: upper right rounded panel with title; two model blocks, first pale blue and second red, with data D1 and D2 above; snowflake near first model and flame near second model; directed arrow from first to second and dashed continuation to right; yellow prototype bank with three colored nodes and class centroid dots. Basis: two-stage left-to-right prototype method with bank centered below.</desc>
    <rect id="f02" data-plus-kind="frame" x="284" y="10" width="267" height="156" rx="2" ry="2" fill="#fffcef" stroke="#000" stroke-width="1.5" />
    <text id="title-b" class="panel-title" x="287" y="26">(b) Prototype-based Methods</text>

    <text id="b-d1" class="small" x="329" y="43">D₁</text>
    <path id="b-d1-arrow" class="line" d="M336 47 V57" marker-end="url(#arrow-black)" />
    <g id="b-snow" transform="translate(363 55)"><path d="M0 -8 V8 M-6.9 -4 L6.9 4 M-6.9 4 L6.9 -4 M-3 -6 L0 -4 L3 -6 M-3 6 L0 4 L3 6 M-7 0 L-4 -1.8 L-4 1.8 M7 0 L4 -1.8 L4 1.8" fill="none" stroke="#35a9e7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></g><text id="b-d2" class="small" x="452" y="43">D₂</text>
    <path id="b-d2-arrow" class="line" d="M459 47 V57" marker-end="url(#arrow-black)" />
    <g id="b-fire" transform="translate(478 45) scale(0.9)"><path d="M9 22 C4 20 1 16 2.5 11 C3.5 7.5 6.5 5.5 7.5 2 C9.5 6.5 12 7.5 12 1.5 C16.5 6 20 10.5 19 15.5 C18 20 14 23.5 9 22 Z" fill="#ff7a22" stroke="#e23b25" stroke-width="1.1" /><path d="M10 21 C7.5 19 6.8 16.2 8.4 13.5 C9.4 11.8 11.1 10.7 11.4 8.2 C13.5 10.5 15.4 13.1 14.9 16.3 C14.5 19 12.7 20.7 10 21 Z" fill="#ffd447" stroke="#ffb000" stroke-width="0.6" /><path d="M4 6 L2 3 M17 5 L19 2 M20 10 L23 8" stroke="#ffb000" stroke-width="1" stroke-linecap="round" /></g><path id="b-model1" d="M316 59 L358 59 L374 92 L299 92 Z" fill="#d9ebf7" stroke="#000" stroke-width="1.5" />
    <text id="b-model1-text" class="tiny"><tspan x="315" y="78">Model</tspan><tspan x="346" y="82" font-size="8">t1</tspan></text><path id="b-to-model2" class="line" d="M374 71 H428" marker-end="url(#arrow-black)" />
    <path id="b-model2" d="M436 59 L479 59 L496 92 L421 92 Z" fill="#f36d6d" stroke="#000" stroke-width="1.5" />
