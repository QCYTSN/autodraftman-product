    <g id="c-text-icon" transform="translate(78 292)"><rect x="0" y="0" width="16" height="20" fill="#e6f7ff" stroke="#000" stroke-width="1" /><path d="M12 0 L16 4 L12 4 Z" fill="#ffffff" stroke="#000" stroke-width="0.6" /><line x1="3" y1="5" x2="12" y2="5" stroke="#1e88c8" stroke-width="1" /><line x1="3" y1="8" x2="13" y2="8" stroke="#1e88c8" stroke-width="1" /><line x1="3" y1="11" x2="11" y2="11" stroke="#1e88c8" stroke-width="1" /><line x1="3" y1="14" x2="9" y2="14" stroke="#1e88c8" stroke-width="1" /><rect x="15" y="2" width="8" height="8" fill="#f9c74f" stroke="#000" stroke-width="0.8" /><line x1="17" y1="5" x2="21" y2="5" stroke="#8a6d00" stroke-width="0.7" /><circle cx="21" cy="14" r="5" fill="none" stroke="#000" stroke-width="1.5" /><circle cx="21" cy="14" r="2" fill="#2aa8e8" stroke="#000" stroke-width="0.6" /><path d="M24.5 17.5 L30 23" stroke="#000" stroke-width="1.6" stroke-linecap="round" /></g><rect id="f06" data-plus-kind="frame" x="285" y="285" width="263" height="153" fill="#fbfbfb" stroke="#000" stroke-width="1.4" stroke-dasharray="4 2" />
