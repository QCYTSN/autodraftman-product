    <text id="a-model1-text" class="tiny"><tspan x="39" y="83">Model</tspan><tspan x="70" y="87" font-size="8">t1</tspan></text><path id="a-flow-12" class="line" d="M99 80 H109" marker-end="url(#arrow-black)" />
    <path id="a-model2" d="M119 68 L163 68 L178 92 L101 92 Z" fill="#bfe6c5" stroke="#000" stroke-width="1.5" />
    <text id="a-model2-text" class="tiny"><tspan x="117" y="83">Model</tspan><tspan x="148" y="87" font-size="8">t2</tspan></text><path id="a-flow-23" class="line" d="M178 80 H188" marker-end="url(#arrow-black)" />
    <path id="a-model3" d="M196 68 L240 68 L255 92 L179 92 Z" fill="#5aa7a2" stroke="#000" stroke-width="1.5" />
    <text id="a-model3-text" class="tiny"><tspan x="195" y="83">Model</tspan><tspan x="226" y="87" font-size="8">t3</tspan></text><path id="a-flow-out" class="dash" d="M255 80 H268" marker-end="url(#arrow-black)" />

    <rect id="a-memory-buffer" x="18" y="128" width="235" height="26" rx="2" ry="2" fill="#fee6a8" stroke="#000" stroke-width="1.5" />
