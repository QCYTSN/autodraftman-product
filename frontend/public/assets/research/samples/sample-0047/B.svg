<svg xmlns="http://www.w3.org/2000/svg" width="555" height="448" viewBox="0 0 555 448">
  <defs>
    <marker id="arrow-black" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" viewBox="0 0 10 8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000" id="plus_node_0" />
    </marker>
    <marker id="arrow-black-start" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" viewBox="0 0 10 8" refX="0" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000" id="plus_node_1" />
    </marker>
    <marker id="arrow-red" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" viewBox="0 0 10 8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#b40000" id="plus_node_2" />
    </marker>
    <style>
      .panel-title{font-family:"Times New Roman",serif;font-size:14px;font-weight:bold;fill:#000}
      .small{font-family:"Times New Roman",serif;font-size:12px;font-weight:bold;fill:#000}
      .tiny{font-family:"Times New Roman",serif;font-size:11px;font-weight:bold;fill:#000}
      .redlabel{font-family:"Times New Roman",serif;font-size:14px;font-weight:bold;fill:#9b1111}
      .redsmall{font-family:"Times New Roman",serif;font-size:12px;font-weight:bold;fill:#9b1111}
      .line{stroke:#000;stroke-width:1.5;fill:none}
      .dash{stroke:#000;stroke-width:1.5;fill:none;stroke-dasharray:4 2}
      .frame{stroke:#000;stroke-width:1.5;fill:none}
    </style>
  </defs>

  <rect id="canvas-bg" x="0" y="0" width="555" height="448" fill="#ffffff" />

  
  <g id="panel-a">
    <title>(a) Exemplar-based Methods</title>
    <desc>Inventory: upper left rounded panel with title; three green model blocks arranged horizontally, incoming data labels D1 D2 D3 above with vertical arrows; black horizontal flow arrow through models continuing dashed to the right; lower yellow memory buffer with image icon; store, replay, update labels and vertical arrows connecting models and buffer. Basis: horizontal equipartition of three models over a shared buffer.</desc>
    <rect id="f01" data-plus-kind="frame" x="6" y="10" width="269" height="156" rx="2" ry="2" fill="#edf8f8" stroke="#000" stroke-width="1.5" />
    <text id="title-a" class="panel-title" x="9" y="26">(a) Exemplar-based Methods</text>

    <text id="a-d1" class="small" x="51" y="48">D₁</text>
    <text id="a-d2" class="small" x="128" y="48">D₂</text>
    <text id="a-d3" class="small" x="206" y="48">D₃</text>
    <path id="a-d1-arrow" class="line" d="M58 52 V66" marker-end="url(#arrow-black)" />
    <path id="a-d2-arrow" class="line" d="M136 52 V66" marker-end="url(#arrow-black)" />
    <path id="a-d3-arrow" class="line" d="M213 52 V66" marker-end="url(#arrow-black)" />

    <path id="a-main-flow-left" class="line" d="M14 80 H29" marker-end="url(#arrow-black)" />
