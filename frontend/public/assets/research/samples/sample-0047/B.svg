    <text id="c-shared-label" class="redlabel" x="22" y="222">Shared Space</text>

    <rect id="f07" data-plus-kind="frame" x="226" y="213" width="123" height="55" fill="#fff7f7" stroke="#000" stroke-width="1.2" stroke-dasharray="4 2" />
    <text id="c-anchor-title" class="redsmall" x="239" y="229">Prompt Anchors</text>
