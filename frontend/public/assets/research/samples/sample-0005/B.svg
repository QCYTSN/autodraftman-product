<svg xmlns="http://www.w3.org/2000/svg" width="609" height="277" viewBox="0 0 609 277">
  <title>Fenwick tree nodes and deformation relative to previous frame</title>
  <desc>
    Inventory: light-blue Fenwick node rectangles arranged in three rows with labels r_k,T_k and superscript indices [4], [2], [6], [1], [3], [5], [7]; seven aligned deformation blocks below; two query boxes at the right; blue arrows connect nodes [4] and [6] to Query 6; purple arrows connect nodes [4], [6], and [7] to Query 7. Origin for conduction is the large top node [4]. The construction uses horizontal row alignment and bottom-row equipartition of deformation blocks.
  </desc>

  <defs>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8fc3d7" id="plus_node_0" />
    </marker>
    <marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#aaa9ea" id="plus_node_1" />
    </marker>

    <style>
      .label {
        font-family: "Times New Roman", Times, serif;
        font-size: 15px;
        fill: #000000;
      }
      .nodeText {
        font-family: "Times New Roman", Times, serif;
        font-size: 13px;
        fill: #000000;
      }
      .queryText {
        font-family: "Times New Roman", Times, serif;
        font-size: 15px;
        fill: #000000;
      }
      .mathItalic {
        font-style: italic;
      }
      .super {
        font-size: 9px;
        baseline-shift: super;
      }
      .sub {
        font-size: 9px;
        baseline-shift: sub;
      }
    </style>
  </defs>

  <rect id="bg" x="0" y="0" width="609" height="277" fill="#ffffff" />

  
  <rect id="f01" data-plus-kind="frame" x="126" y="36" width="210" height="51" fill="#d8e9fa" />
  <rect id="f02" data-plus-kind="frame" x="126" y="94" width="104" height="50" fill="#d8e9fa" />
  <rect id="f03" data-plus-kind="frame" x="341" y="94" width="108" height="50" fill="#d8e9fa" />
  <rect id="f04" data-plus-kind="frame" x="126" y="153" width="50" height="50" fill="#d8e9fa" />
  <rect id="f05" data-plus-kind="frame" x="234" y="153" width="50" height="50" fill="#d8e9fa" />
  <rect id="f06" data-plus-kind="frame" x="341" y="153" width="50" height="50" fill="#d8e9fa" />
  <rect id="f07" data-plus-kind="frame" x="449" y="153" width="50" height="50" fill="#d8e9fa" />

  
  <rect id="f08" data-plus-kind="frame" x="126" y="212" width="50" height="49" fill="#bdcfde" />
  <rect id="f09" data-plus-kind="frame" x="180" y="212" width="50" height="49" fill="#bdcfde" />
  <rect id="f10" data-plus-kind="frame" x="234" y="212" width="50" height="49" fill="#bdcfde" />
  <rect id="f11" data-plus-kind="frame" x="288" y="212" width="50" height="49" fill="#bdcfde" />
  <rect id="f12" data-plus-kind="frame" x="342" y="212" width="50" height="49" fill="#bdcfde" />
  <rect id="f13" data-plus-kind="frame" x="396" y="212" width="49" height="49" fill="#bdcfde" />
  <rect id="f14" data-plus-kind="frame" x="449" y="212" width="50" height="49" fill="#bdcfde" />

  
  <g id="arrowGroup">
    <path id="a01_node4_to_query6" d="M341 61 L529 50" fill="none" stroke="#8fc3d7" stroke-width="2.2" marker-end="url(#arrowBlue)" />
    <path id="a02_node6_to_query6" d="M449 118 L529 57" fill="none" stroke="#8fc3d7" stroke-width="2.2" marker-end="url(#arrowBlue)" />

    <path id="a03_node4_to_query7" d="M341 62 L529 140" fill="none" stroke="#aaa9ea" stroke-width="2.2" marker-end="url(#arrowPurple)" />
    <path id="a04_node6_to_query7" d="M449 118 L529 148" fill="none" stroke="#aaa9ea" stroke-width="2.2" marker-end="url(#arrowPurple)" />
    <path id="a05_node7_to_query7" d="M499 178 L529 153" fill="none" stroke="#aaa9ea" stroke-width="2.2" marker-end="url(#arrowPurple)" />
  </g>

  
  <rect id="f15" data-plus-kind="frame" x="531" y="28" width="50" height="50" fill="#98c5d4" />
  <rect id="f16" data-plus-kind="frame" x="531" y="124" width="50" height="50" fill="#aaa9ea" />

  
  <text id="labelFenwickTree" class="label" text-anchor="middle">
    <tspan x="75" y="116">Fenwick Tree</tspan>
    <tspan x="75" y="132">Nodes</tspan>
  </text>

  <text id="labelDeformation" class="label" text-anchor="middle">
    <tspan x="75" y="224">Deformation</tspan>
    <tspan x="75" y="241">relative to the</tspan>
    <tspan x="75" y="258">previous frame</tspan>
  </text>

  
