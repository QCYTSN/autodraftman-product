7]</tspan></text><text id="txtQuery6" class="queryText" text-anchor="middle"><tspan x="556" y="94">Query:</tspan><tspan x="556" y="113"><tspan class="mathItalic">r</tspan><tspan class="sub">k</tspan><tspan class="super">6</tspan><tspan>, </tspan><tspan class="mathItalic">T</tspan><tspan class="sub">k</tspan><tspan class="super">6</tspan></tspan></text><text id="txtQuery7" class="queryText" text-anchor="middle"><tspan x="556" y="190">Query:</tspan><tspan x="556" y="209"><tspan class="mathItalic">r</tspan><tspan class="sub">k</tspan><tspan class="super">7</tspan><tspan>, </tspan><tspan class="mathItalic">T</tspan><tspan class="sub">k</tspan><tspan class="super">7</tspan></tspan></text></svg>