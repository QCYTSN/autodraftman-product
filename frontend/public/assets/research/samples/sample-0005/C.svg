<svg xmlns="http://www.w3.org/2000/svg" width="609" height="277" viewBox="0 0 609 277">
  <title>Fenwick tree node ranges and query arrows</title>
  <desc>
    Base-frame inventory: the figure contains light-blue Fenwick tree node frames arranged by hierarchy, seven grey deformation frames aligned along the bottom, and two colored query frames at the right. The upper wide node [4] connects to both query regions; the node [6] connects to both query regions; the node [7] connects to the lower query. The top section follows a Fenwick-tree hierarchical symmetry: one wide parent, two middle nodes, four leaf nodes. The bottom deformation row is an evenly spaced horizontal equipartition aligned with the leaf columns.
  </desc>

  <defs>
    <marker id="arrowHeadTeal" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#88bdd2" id="plus_node_0" />
    </marker>
    <marker id="arrowHeadPurple" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#a5a4e7" id="plus_node_1" />
    </marker>
    <marker id="arrowHeadPurpleStartLarge" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="19" refX="0" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#a5a4e7" id="plus_node_2" />
    </marker>
    <marker id="arrowHeadPurpleEndLarge" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="19" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#a5a4e7" id="plus_node_3" />
    </marker>
    <style>
      .label { font-family: "Times New Roman", Times, serif; font-size: 15px; fill: #000; }
      .math { font-family: "Times New Roman", Times, serif; font-size: 14px; fill: #000; }
      .queryText { font-family: "Times New Roman", Times, serif; font-size: 15px; fill: #000; }
      .nodeFill { fill: #d8eafb; }
      .deformFill { fill: #b8ccdc; }
      .tealFill { fill: #95c5d3; }
      .purpleFill { fill: #aaa8e8; }
    </style>
  </defs>

  <rect id="background" x="0" y="0" width="609" height="277" fill="#ffffff" />

  
  <rect id="f01_node_4" data-plus-kind="frame" class="nodeFill" x="126" y="36" width="210" height="51" />
  <rect id="f02_node_2" data-plus-kind="frame" class="nodeFill" x="126" y="95" width="104" height="49" />
  <rect id="f03_node_6" data-plus-kind="frame" class="nodeFill" x="342" y="95" width="106" height="49" />
  <rect id="f04_node_1" data-plus-kind="frame" class="nodeFill" x="126" y="153" width="51" height="49" />
