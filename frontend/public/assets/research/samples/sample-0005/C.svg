  <rect id="f14_deform_7" data-plus-kind="frame" class="deformFill" x="449" y="212" width="50" height="50" />

  <rect id="f15_query_6" data-plus-kind="frame" class="tealFill" x="531" y="28" width="50" height="50" />
  <rect id="f16_query_7" data-plus-kind="frame" class="purpleFill" x="531" y="124" width="50" height="50" />

  
  <path id="arrow_asset_sam_region_000002_node4_to_query6" d="M340 61 L528 50" fill="none" stroke="#88bdd2" stroke-width="2" marker-end="url(#arrowHeadTeal)" />
  <path id="arrow_asset_sam_region_000000_node6_to_query6" d="M448 122 L529 56" fill="none" stroke="#88bdd2" stroke-width="2" marker-end="url(#arrowHeadTeal)" />

  <path id="arrow_asset_sam_region_000003_node4_to_query7" d="M340 62 L528 140" fill="none" stroke="#a5a4e7" stroke-width="2" marker-end="url(#arrowHeadPurple)" />
