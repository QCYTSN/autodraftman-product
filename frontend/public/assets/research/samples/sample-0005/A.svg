span><tspan x="243" y="187" font-size="9" font-style="italic" fill="#0057a8">k</tspan><tspan x="245.3" y="176" font-size="9" fill="#0057a8">[3]</tspan><tspan x="256.8" y="183">, </tspan><tspan x="266.4" y="183" font-style="italic">T</tspan><tspan x="274.1" y="187" font-size="9" font-style="italic" fill="#0057a8">k</tspan><tspan x="276.4" y="176" font-size="9" fill="#0057a8">[3]</tspan></text><text id="text_node_5" class="math"><tspan x="344.5" y="183" font-style="italic">r</tspan><tspan x="351" y="187" font-size="9" font-style="italic" fill="#0057a8">k</tspan><tspan x="353.3" y="176" font-size="9" fill="#0057a8">[5]</tspan><tspan x="364.8" y="183">, </tspan><tspan x="374.4" y="183" font-style="italic">T</tspan><tspan x="382.1" y="187" font-size="9" font-style="italic" fill="#0057a8">k</tspan><tspan x="384.4" y="176" font-size="9" fill="#0057a8">[5]</tspan></text><text id="text_node_7" class="math"><tspan x="451.5" y="183" font-style="italic">r</tspan><tspan x="458" y="187" font-size="9" font-style="italic" fill="#0057a8">k</tspan><tspan x="460.3" y="176" font-size="9" fill="#0057a8">[7]</tspan><tspan x="471.8" y="183">, </tspan><tspan x="481.4" y="183" font-style="italic">T</tspan><tspan x="489.1" y="187" font-size="9" font-style="italic" fill="#0057a8">k</tspan><tspan x="491.4" y="176" font-size="9" fill="#0057a8">[7]</tspan></text><text id="label_query_6" class="queryText" x="535" y="94">Query:</text>
