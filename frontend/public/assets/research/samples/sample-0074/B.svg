<svg xmlns="http://www.w3.org/2000/svg" width="1746" height="468" viewBox="0 0 1746 468">
  <title>KV compression and sparse attention pipeline with rope, offline calibration, token selection, fused recover kernel, and FA</title>
  <desc>
    The figure is a left-to-right pipeline. Inventory: stacked pre-rope query/key blocks at left feed flattened row vectors, which combine through a multiply node with a compressed green key covariance/cache result from an offline calibration frame. The flow continues to selected orange/blue blocks, a latent key cache, an approximate attention score box, a selected-dimension cache, a top-k index box, transpose path, then a fused recover kernel frame with reconstruction/rope paths and a multiply node. Rope is also shown as a long top bypass line to post-rope query. Post-rope query and critical post-rope key stacks feed an orange FA block. Bottom dotted stage arrows divide Stage 1 KV compression, Stage 2 Token selection, and Stage 3 Sparse attention. Symmetry/equipartition basis: matrix cells use repeated equal columns/rows; stacked query/key icons are offset parallel copies; the three bottom stages are horizontally partitioned by process boundaries, not equal-width symmetry.
  </desc>

  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000" id="plus_node_0" />
    </marker>
    <marker id="arrowStart" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
      <path d="M10,0 L0,4 L10,8 Z" fill="#000" id="plus_node_1" />
    </marker>
    <marker id="smallArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#000" id="plus_node_2" />
    </marker>
    <style>
      .serif{font-family:"Times New Roman",Times,serif}
      .sans{font-family:Arial,Helvetica,sans-serif}
      .label{font-family:"Times New Roman",Times,serif;font-size:26px;fill:#000}
      .small{font-family:"Times New Roman",Times,serif;font-size:20px;fill:#000}
      .tiny{font-family:"Times New Roman",Times,serif;font-size:18px;fill:#000}
      .math{font-family:"Times New Roman",Times,serif;font-size:20px;font-style:italic;fill:#000}
      .line{stroke:#000;stroke-width:2.7;fill:none}
      .thin{stroke:#000;stroke-width:1.8;fill:none}
      .dashFrame{stroke:#6d321c;stroke-width:2.5;stroke-dasharray:8 4;fill:#fff6ed}
      .grid{stroke:#000;stroke-width:1.6}
      .dot{stroke:#000;stroke-width:1.7;stroke-dasharray:1.5 3;fill:none}
    </style>
  </defs>

