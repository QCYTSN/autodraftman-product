<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2857" viewBox="0 0 3840 2857">
  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="16" markerHeight="16" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L18,9 L0,18 Z" fill="#000"/>
    </marker>
    <style>
      .serif{font-family:"Times New Roman", Times, serif;}
      .italic{font-style:italic;}
