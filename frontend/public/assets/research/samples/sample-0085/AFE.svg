      .thinGrey{stroke:#c9c9c9;stroke-width:8;fill:none;}
      .wire{stroke:#000;stroke-width:8;fill:none;stroke-linecap:square;stroke-linejoin:miter;}
      .arrowline{stroke:#000;stroke-width:8;fill:none;stroke-linecap:square;stroke-linejoin:miter;marker-end:url(#arrow);}
