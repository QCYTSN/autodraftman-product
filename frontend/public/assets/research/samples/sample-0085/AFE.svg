  <text class="serif italic black" x="1734" y="2592" font-size="118">D<tspan font-size="72" baseline-shift="-24">1</tspan></text>
  <text class="serif italic black" x="2054" y="2592" font-size="118">D<tspan font-size="72" baseline-shift="-24">2</tspan></text>
