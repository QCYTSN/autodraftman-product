<svg xmlns="http://www.w3.org/2000/svg" width="584" height="392" viewBox="0 0 584 392">
  <title>Comparison of modality-aware and token-aware quantization methods</title>
  <desc>Three horizontally arranged comparison panels. Each panel has left status indicators, a D block, arrows, scaling/token bars, and a Wq output block. The construction includes native SVG drawings first; supplied SAM icon crops are then bound as replacements for the six status icons only.</desc>

  <defs>
    <linearGradient id="gradS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e51c23" />
      <stop offset="42%" stop-color="#ffd229" />
      <stop offset="70%" stop-color="#13b84a" />
      <stop offset="100%" stop-color="#1968b2" />
    </linearGradient>
    <linearGradient id="gradSY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e51c23" />
      <stop offset="50%" stop-color="#ffd229" />
      <stop offset="100%" stop-color="#1976bd" />
    </linearGradient>
    <linearGradient id="gradOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f04c2f" />
      <stop offset="50%" stop-color="#ffd451" />
      <stop offset="100%" stop-color="#f3a23b" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00b86b" />
      <stop offset="100%" stop-color="#1aa87c" />
    </linearGradient>
    <linearGradient id="gradRedToken" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e60012" />
      <stop offset="62%" stop-color="#ff4b54" />
      <stop offset="100%" stop-color="#ffe3e6" />
    </linearGradient>
    <linearGradient id="gradOrangeToken" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f07c22" />
      <stop offset="62%" stop-color="#ffb044" />
      <stop offset="100%" stop-color="#fff0d0" />
    </linearGradient>
    <linearGradient id="gradGreenToken" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00a365" />
      <stop offset="100%" stop-color="#27c279" />
    </linearGradient>
    <linearGradient id="gradBlueToken" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#006db8" />
      <stop offset="100%" stop-color="#77bde8" />
    </linearGradient>
    <pattern id="diagHatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#ffffff" id="plus_node_0" />
      <path d="M-2,2 L2,-2 M0,8 L8,0 M6,10 L10,6" stroke="#d8d8d8" stroke-width="1" id="plus_node_1" />
    </pattern>
    <style>
      .serif{font-family:"Times New Roman", Times, serif;}
      .sans{font-family:Arial, Helvetica, sans-serif;}
      .label{font-family:"Times New Roman", Times, serif;font-size:17px;font-weight:700;fill:#000;}
      .caption{font-family:"Times New Roman", Times, serif;font-size:15px;font-weight:700;fill:#000;}
      .smallcap{font-family:"Times New Roman", Times, serif;font-size:14px;font-weight:700;fill:#000;}
      .mathbig{font-family:"Times New Roman", Times, serif;font-size:36px;font-style:italic;fill:#000;}
      .bartext{font-family:"Times New Roman", Times, serif;font-size:14px;font-style:italic;fill:#000;}
    </style>
  </defs>

  <rect id="background" x="0" y="0" width="584" height="392" fill="#ffffff" />
  <rect id="f01" data-plus-kind="frame" x="0" y="0" width="584" height="123" fill="none" stroke="none" />
  <rect id="f02" data-plus-kind="frame" x="0" y="123" width="584" height="137" fill="none" stroke="none" />
  <rect id="f03" data-plus-kind="frame" x="0" y="260" width="584" height="132" fill="none" stroke="none" />

  <g id="draft_status_icons">
    <desc>Six left status icons: top row has red cross for modality-aware and red cross for token-aware; middle row has green check and red cross; bottom row has two green checks. These correspond to the SAM picture assets P001-P006.</desc>
    </g>

  <g id="left_labels">
    <text id="top_label_modality" class="label" x="50" y="40">Modality-aware</text>
    <text id="top_label_token" class="label" x="50" y="75">Token-aware</text>
    <text id="mid_label_modality" class="label" x="50" y="177">Modality-aware</text>
    <text id="mid_label_token" class="label" x="50" y="212">Token-aware</text>
    <text id="bot_label_modality" class="label" x="50" y="313">Modality-aware</text>
    <text id="bot_label_token" class="label" x="50" y="348">Token-aware</text>
  </g>

  <g id="panel_top">
    <desc>Top section: origin is the pale green D block. To its right is a thick white outlined arrow, one global fixed-scaling vertical S bar, another arrow, and a hatched Wq block. Status indicators at left both show red crosses. Symmetry is horizontal flow from D to Wq.</desc>
    <rect id="top_D_box" x="178" y="12" width="80" height="80" fill="#dce9d4" stroke="#000" stroke-width="1" />
    <text id="top_D_text" class="mathbig" x="205" y="63">D</text>

    <polygon id="top_arrow_1" points="268,45 336,45 336,38 357,52 336,66 336,59 268,59" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="miter" />
    <text id="top_fixed_scaling" class="smallcap" x="335" y="8">Fixed scaling</text>
    <rect id="top_S_bar" x="364" y="12" width="17" height="80" fill="url(#gradS)" stroke="#000" stroke-width=".6" />
    <text id="top_S_text" class="bartext" x="368" y="56">S</text>
    <polygon id="top_arrow_2" points="390,45 458,45 458,38 479,52 458,66 458,59 390,59" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="miter" />

    <rect id="top_W_box" x="486" y="12" width="80" height="80" fill="url(#diagHatch)" stroke="#000" stroke-width="1" />
    <text id="top_W_text" class="mathbig" x="508" y="62">W<tspan font-size="18" baseline-shift="-30%">q</tspan></text>

    <text id="top_caption" class="caption" x="212" y="108">
      <tspan font-style="italic">e.g.</tspan>
      <tspan> SmoothQuant </tspan>
      <tspan font-weight="400">(Channel-wise static quantization)</tspan>
    </text>
  </g>

  <line id="separator_1" x1="178" y1="123" x2="566" y2="123" stroke="#000" stroke-width="1.6" stroke-dasharray="7 5" />

  <g id="panel_middle">
    <desc>Middle section: origin is the D block. Flow proceeds rightward through a short arrow to two modality scaling bars labeled sw and s, then another arrow to a global S bar, a final arrow, and a hatched Wq block. Left statuses indicate modality-aware true and token-aware false. The two modality bars form an equipartitioned pair.</desc>
    <rect id="mid_D_box" x="178" y="149" width="80" height="80" fill="#dce9d4" stroke="#000" stroke-width="1" />
    <text id="mid_D_text" class="mathbig" x="205" y="200">D</text>

    <polygon id="mid_arrow_1" points="270,185 288,185 288,177 306,189 288,201 288,194 270,194" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="miter" />
    <text id="mid_title" class="smallcap" x="279" y="145">Different modalities</text>
    <rect id="mid_bar_sw" x="315" y="149" width="17" height="80" fill="url(#gradOrange)" stroke="#000" stroke-width=".6" />
    <rect id="mid_bar_s" x="338" y="149" width="17" height="80" fill="url(#gradGreen)" stroke="#000" stroke-width=".6" />
    <text id="mid_sw_text" class="bartext" x="318" y="193">s<tspan font-size="9" baseline-shift="-25%">w</tspan></text>
    <text id="mid_s_text" class="bartext" x="343" y="193">s</text>

    <polygon id="mid_arrow_2" points="367,185 385,185 385,177 403,189 385,201 385,194 367,194" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="miter" />
    <rect id="mid_S_bar" x="412" y="149" width="17" height="80" fill="url(#gradSY)" stroke="#000" stroke-width=".6" />
    <text id="mid_S_text" class="bartext" x="416" y="193">S</text>

    <polygon id="mid_arrow_3" points="442,185 457,185 457,177 475,189 457,201 457,194 442,194" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="miter" />
    <rect id="mid_W_box" x="486" y="149" width="80" height="80" fill="url(#diagHatch)" stroke="#000" stroke-width="1" />
    <text id="mid_W_text" class="mathbig" x="508" y="199">W<tspan font-size="18" baseline-shift="-30%">q</tspan></text>

    <text id="mid_caption" class="caption" x="251" y="245">
      <tspan font-style="italic">e.g.</tspan>
      <tspan> MBQ </tspan>
      <tspan font-weight="400">(Modality-aware quantization)</tspan>
    </text>
  </g>

  <line id="separator_2" x1="178" y1="260" x2="566" y2="260" stroke="#000" stroke-width="1.6" stroke-dasharray="7 5" />

  <g id="panel_bottom">
    <desc>Bottom section: origin is the D block. Flow proceeds rightward through one arrow to a sequence of token expert bars t1, t2, t3, ellipsis, tn, then an arrow to a hatched Wq block. Left statuses are both green checks. The token bars are separated vertical experts arranged by token order.</desc>
    <rect id="bot_D_box" x="178" y="285" width="80" height="80" fill="#dce9d4" stroke="#000" stroke-width="1" />
    <text id="bot_D_text" class="mathbig" x="205" y="336">D</text>

    <polygon id="bot_arrow_1" points="271,321 291,321 291,313 312,325 291,338 291,330 271,330" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="miter" />
    <text id="bot_title" class="smallcap" x="325" y="281">Different tokens</text>

    <rect id="bot_bar_t1" x="323" y="285" width="17" height="80" fill="url(#gradRedToken)" stroke="#000" stroke-width=".6" />
    <rect id="bot_bar_t2" x="344" y="285" width="17" height="80" fill="url(#gradOrangeToken)" stroke="#000" stroke-width=".6" />
    <rect id="bot_bar_t3" x="365" y="285" width="17" height="80" fill="url(#gradGreenToken)" stroke="#000" stroke-width=".6" />
    <text id="bot_t1_text" class="bartext" x="326" y="329">t<tspan font-size="9" baseline-shift="-25%">1</tspan></text>
    <text id="bot_t2_text" class="bartext" x="347" y="329">t<tspan font-size="9" baseline-shift="-25%">2</tspan></text>
    <text id="bot_t3_text" class="bartext" x="368" y="329">t<tspan font-size="9" baseline-shift="-25%">3</tspan></text>
    <text id="bot_ellipsis" class="serif" x="386" y="328" font-size="18" font-weight="700">···</text>
    <rect id="bot_bar_tn" x="406" y="285" width="17" height="80" fill="url(#gradBlueToken)" stroke="#000" stroke-width=".6" />
    <text id="bot_tn_text" class="bartext" x="409" y="329">t<tspan font-size="9" baseline-shift="-25%">n</tspan></text>

    <polygon id="bot_arrow_2" points="436,321 454,321 454,313 475,325 454,338 454,330 436,330" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="miter" />
    <rect id="bot_W_box" x="486" y="285" width="80" height="80" fill="url(#diagHatch)" stroke="#000" stroke-width="1" />
    <text id="bot_W_text" class="mathbig" x="508" y="335">W<tspan font-size="18" baseline-shift="-30%">q</tspan></text>

    <text id="bot_caption" class="caption" x="217" y="381">
      <tspan>Quant Experts </tspan>
      <tspan font-weight="400">(Token-aware adaptive quantization)</tspan>
    </text>
  </g>

  <g id="sam_status_icon_replacements" transform="translate(0 0)" data-plus-keeps="top_label_modality top_label_token mid_label_modality mid_label_token bot_label_modality bot_label_token">
    <title>SAM replacements for only the six left status icons; text labels and all quantization diagrams remain native SVG.</title>
    <image id="sam_p001_icon" href="data:image/png;base64," x="20" y="21" width="25" height="26" preserveAspectRatio="none" />
    <image id="sam_p003_icon" href="data:image/png;base64," x="20" y="56" width="25" height="26" preserveAspectRatio="none" />
    <image id="sam_p004_icon" href="data:image/png;base64," x="20" y="158" width="25" height="26" preserveAspectRatio="none" />
    <image id="sam_p002_icon" href="data:image/png;base64," x="20" y="193" width="25" height="26" preserveAspectRatio="none" />
    <image id="sam_p005_icon" href="data:image/png;base64," x="20" y="294" width="25" height="26" preserveAspectRatio="none" />
    <image id="sam_p006_icon" href="data:image/png;base64," x="20" y="329" width="25" height="26" preserveAspectRatio="none" />
  </g>
</svg>