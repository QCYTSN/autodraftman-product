<svg xmlns="http://www.w3.org/2000/svg" width="1195" height="270" viewBox="0 0 1195 270">
  <title>Pipeline diagram: input meshes to converted 3D-GS, 4D representation, temporal smoothness regularization, rendered video, VAE encoder, noise selection, and video model</title>
  <desc>
    Base frames and content inventory: left input rounded rectangle feeds a dashed 3D cube with a person/table scene; this feeds a blue dashed 4D cube with the same scene. Curved operation/gradient arrows connect the 4D representation to a pink spatial-temporal regularization block and the rendered video frames. The rendered video is a stack of slanted image frames feeding a yellow VAE encoder. At right, a small graph and legend explain operation and gradient; selected noise and add-noise arrows feed a rounded yellow video-model icon. A long dashed gradient return line runs along the bottom. SAM mapping: Original Figure Object video model icon - Constructed Element ID draft_video_model - SAM Asset ID asset_sam_region_000019; the image crop covers only the icon, not the “Video Model” label or adjacent arrows.
  </desc>

  <defs>
    <marker id="arrowStd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#111" id="plus_node_0" />
    </marker>
    <marker id="arrowSmall" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#111" transform="scale(.7 .75)" id="plus_node_1" />
    </marker>
    <marker id="arrowStartSmall" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#111" transform="scale(.7 .75)" id="plus_node_2" />
    </marker>
    <marker id="arrowDbl16" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#111" transform="scale(1.6 1.5)" id="plus_node_3" />
    </marker>
    <marker id="arrowDbl16Start" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="1" refY="6" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#111" transform="scale(1.6 1.5)" id="plus_node_4" />
    </marker>
    <marker id="arrowRedTiny" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#cc5147" transform="scale(.7 .75)" id="plus_node_5" />
    </marker>

    <linearGradient id="vaeGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffe6a9" />
      <stop offset="1" stop-color="#fff8de" />
    </linearGradient>
    <linearGradient id="cubeFade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".0" />
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".15" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".55" />
    </linearGradient>

    <clipPath id="clipCubeLeft">
      <polygon points="167,69 246,43 324,70 324,173 246,203 167,173" id="plus_node_6" />
    </clipPath>
    <clipPath id="clipCubeMid">
      <polygon points="365,69 443,43 521,70 521,173 443,203 365,173" id="plus_node_7" />
    </clipPath>
    <clipPath id="clipSmallFrameA">
      <polygon points="586,101 655,122 655,218 586,195" id="plus_node_8" />
    </clipPath>
    <clipPath id="clipSmallFrameB">
      <polygon points="651,101 721,122 721,218 651,195" id="plus_node_9" />
    </clipPath>
    <clipPath id="clipSmallFrameC">
      <polygon points="717,101 785,122 785,218 717,195" id="plus_node_10" />
    </clipPath>

    <pattern id="checker" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#eeeeee" id="plus_node_11" />
      <rect width="9" height="9" fill="#9f9f9f" id="plus_node_12" />
      <rect x="9" y="9" width="9" height="9" fill="#9f9f9f" id="plus_node_13" />
    </pattern>

    <symbol id="symScene" viewBox="0 0 160 160">
      <desc>Reusable constructed scene: dark-suited standing person, checker floor, brown table, and green mesh/interaction line.</desc>
      <g id="scene_floor">
        <polygon points="12,91 142,91 160,145 0,145" fill="url(#checker)" opacity=".95" id="plus_node_14" />
        <g stroke="#d0d0d0" stroke-width="1" id="plus_node_15">
          <path d="M15,103 H150" id="plus_node_16" />
          <path d="M8,118 H157" id="plus_node_17" />
          <path d="M1,134 H160" id="plus_node_18" />
          <path d="M36,92 L14,145" id="plus_node_19" />
          <path d="M66,92 L54,145" id="plus_node_20" />
          <path d="M94,92 L105,145" id="plus_node_21" />
          <path d="M123,92 L151,145" id="plus_node_22" />
        </g>
      </g>
      <g id="scene_person">
        <ellipse cx="62" cy="31" rx="9" ry="11" fill="#f0c5a4" id="plus_node_23" />
        <path d="M55,31 C53,21 61,17 70,21 C69,29 65,33 58,34 Z" fill="#202020" id="plus_node_24" />
        <path d="M55,42 C47,55 47,77 55,90 L73,88 C78,70 77,54 68,41 Z" fill="#1e2527" id="plus_node_25" />
        <path d="M56,46 L45,68 L51,73 L62,51 Z" fill="#262b2c" id="plus_node_26" />
        <path d="M70,48 L91,63 L87,70 L68,58 Z" fill="#262b2c" id="plus_node_27" />
        <path d="M48,68 L43,81" stroke="#e0b795" stroke-width="5" stroke-linecap="round" id="plus_node_28" />
        <path d="M88,67 L103,75" stroke="#e0b795" stroke-width="5" stroke-linecap="round" id="plus_node_29" />
        <path d="M58,87 L52,130" stroke="#202020" stroke-width="8" stroke-linecap="round" id="plus_node_30" />
        <path d="M69,87 L84,130" stroke="#202020" stroke-width="8" stroke-linecap="round" id="plus_node_31" />
        <path d="M49,132 L65,132" stroke="#111" stroke-width="5" stroke-linecap="round" id="plus_node_32" />
        <path d="M80,132 L96,135" stroke="#111" stroke-width="5" stroke-linecap="round" id="plus_node_33" />
        <path d="M59,42 L64,57 L68,42" fill="#eeeeee" opacity=".7" id="plus_node_34" />
      </g>
      <g id="scene_table">
        <ellipse cx="111" cy="85" rx="45" ry="7" fill="#6a2b0b" id="plus_node_35" />
        <path d="M68,82 C89,76 133,77 154,84 C139,92 91,92 68,82 Z" fill="#5a260b" id="plus_node_36" />
        <path d="M105,89 C104,109 100,123 91,137 L125,137 C116,122 115,107 115,89 Z" fill="#4b210c" id="plus_node_37" />
        <ellipse cx="108" cy="137" rx="25" ry="5" fill="#3b1908" id="plus_node_38" />
      </g>
      <g id="scene_mesh" fill="none">
        <path d="M102,70 L126,49 L146,62 L128,89 Z" stroke="#aaaaaa" stroke-width="2" id="plus_node_39" />
        <path d="M102,70 L128,89 M126,49 L128,89 M146,62 L102,70" stroke="#bcbcbc" stroke-width="1" id="plus_node_40" />
        <circle cx="102" cy="70" r="2.4" fill="#7f7f7f" id="plus_node_41" />
        <circle cx="126" cy="49" r="2.4" fill="#7f7f7f" id="plus_node_42" />
        <circle cx="146" cy="62" r="2.4" fill="#7f7f7f" id="plus_node_43" />
        <circle cx="128" cy="89" r="2.4" fill="#7f7f7f" id="plus_node_44" />
        <path d="M91,63 C102,70 111,78 118,88" stroke="#1b7c5a" stroke-width="4" id="plus_node_45" />
        <path d="M82,60 L103,72" stroke="#111" stroke-width="3" id="plus_node_46" />
      </g>
    </symbol>

    <symbol id="symTinyScene" viewBox="0 0 80 110">
      <use href="#symScene" x="-17" y="-2" width="115" height="115" id="plus_node_47" />
    </symbol>
  </defs>

  <rect id="background" x="0" y="0" width="1195" height="270" fill="#ffffff" />

  
  <g id="f01" data-plus-kind="frame">
    <rect x="58" y="99" width="77" height="60" rx="9" ry="9" fill="#fff0dc" stroke="none" id="plus_node_48" />
  </g>
  <text id="txt_input_meshes" x="96.5" y="124.5" text-anchor="middle" font-family="Times New Roman, serif" font-size="16" fill="#000">Input</text>
  <text id="txt_input_meshes_2" x="96.5" y="144" text-anchor="middle" font-family="Times New Roman, serif" font-size="16" fill="#000">Meshes</text>

  <path id="arrow_input_to_3dgs" d="M141,130 L162,130" fill="none" stroke="#111" stroke-width="1.35" marker-end="url(#arrowSmall)" />

  
  <g id="f02" data-plus-kind="frame">
    <polygon points="167,69 246,43 324,70 324,173 246,203 167,173" fill="none" stroke="#bcbcbc" stroke-width="1.1" stroke-dasharray="4 4" id="plus_node_49" />
    <path d="M167,69 L246,99 L324,70 M246,43 L246,99 L246,203 M167,173 L246,99 L324,173" fill="none" stroke="#bcbcbc" stroke-width="1" stroke-dasharray="4 4" id="plus_node_50" />
  </g>
  <g id="converted_3dgs_scene" clip-path="url(#clipCubeLeft)">
    <use href="#symScene" x="167" y="51" width="160" height="160" id="plus_node_51" />
    <rect x="167" y="43" width="158" height="160" fill="url(#cubeFade)" id="plus_node_52" />
  </g>
  <text id="txt_converted" x="246" y="232" text-anchor="middle" font-family="Times New Roman, serif" font-size="16" fill="#000">Converted 3D-GS</text>

  <path id="arrow_3dgs_to_4d" d="M333,130 L355,130" fill="none" stroke="#111" stroke-width="1.35" marker-end="url(#arrowSmall)" />

  
  <g id="f03" data-plus-kind="frame">
    <polygon points="365,69 443,43 521,70 521,173 443,203 365,173" fill="none" stroke="#add9ff" stroke-width="1.1" stroke-dasharray="4 4" id="plus_node_53" />
    <path d="M365,69 L443,99 L521,70 M443,43 L443,99 L443,203 M365,173 L443,99 L521,173" fill="none" stroke="#add9ff" stroke-width="1" stroke-dasharray="4 4" id="plus_node_54" />
  </g>
  <g id="four_d_scene" clip-path="url(#clipCubeMid)">
