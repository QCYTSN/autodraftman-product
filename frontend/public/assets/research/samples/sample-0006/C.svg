    <rect x="365" y="43" width="158" height="160" fill="#ffffff" opacity=".13" id="plus_node_56" />
  </g>
  <text id="txt_4d_rep" x="443" y="232" text-anchor="middle" font-family="Times New Roman, serif" font-size="16" fill="#000">4D Representation</text>
  <text id="txt_4d_sec" x="443" y="252" text-anchor="middle" font-family="Times New Roman, serif" font-size="16" fill="#000">(Sec 3.3)</text>

  
  <g id="f04" data-plus-kind="frame">
    <rect x="582" y="25" width="201" height="68" rx="11" ry="11" fill="#ffc5bc" stroke="none" id="plus_node_57" />
  </g>
  <text id="txt_regularization_1" x="682.5" y="45" text-anchor="middle" font-family="Times New Roman, serif" font-size="16" fill="#000">Spatial + Temporal</text>
  <text id="txt_regularization_2" x="682.5" y="64" text-anchor="middle" font-family="Times New Roman, serif" font-size="16" fill="#000">Smoothness Regularization</text>
  <text id="txt_regularization_3" x="682.5" y="83" text-anchor="middle" font-family="Times New Roman, serif" font-size="16" fill="#000">(Sec 3.4)</text>

  
  <path id="arrow_4d_to_reg_solid" d="M531,77 C544,63 557,58 572,56" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arrowSmall)" />
  <path id="arrow_reg_to_4d_dashed" d="M572,70 C555,69 543,74 532,88" fill="none" stroke="#111" stroke-width="1.4" stroke-dasharray="9 6" marker-end="url(#arrowSmall)" />
  <path id="arrow_4d_to_video_solid" d="M530,92 C548,120 561,137 583,146" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arrowSmall)" />
  <path id="arrow_video_to_4d_dashed" d="M584,194 C555,188 537,174 526,156" fill="none" stroke="#111" stroke-width="1.4" stroke-dasharray="9 6" marker-end="url(#arrowSmall)" />
  <text id="txt_render" x="555" y="180" text-anchor="middle" font-family="Times New Roman, serif" font-size="16" fill="#000">Render</text>

  
  <g id="f05" data-plus-kind="frame">
