    <polygon points="651,101 721,122 721,218 651,195" fill="#f7f7f7" stroke="#111" stroke-width="1.1" id="plus_node_59" />
    <polygon points="717,101 785,122 785,218 717,195" fill="#f7f7f7" stroke="#111" stroke-width="1.1" id="plus_node_60" />
  </g>
