<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FigFox SVG Editor</title>
    <link href="./svgedit.css" rel="stylesheet" />
    <style>
      @font-face {
        font-family: "Google Sans Flex";
        src: url("../assets/demo/google-sans-flex-latin.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 1000;
        font-display: swap;
      }

      :root {
        --main-bg-color: #f4f4f8;
        --text-color: #1e2437;
        --border-color: #e3e3ed;
        --canvas-bg-color: #f2f2f7;
        --link-color: #6243ce;
        --ruler-color: #f4f2f7;
        --icon-bg-color: #fff;
        --icon-bg-color-hover: #eee8ff;
        --input-color: #fff;
        --orange-color: #6b3df4;
        --top-toolbar-min-height: 66px;
      }

      html, body, #container { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      :root:not([data-native]) .svg_editor {
        grid-template-rows: minmax(0, 1fr);
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "workarea";
        font-family: "Google Sans Flex", "Noto Sans SC", sans-serif;
        font-size: 11px;
        background: #f8f7fa;
      }
      :root:not([data-native]) .svg_editor.open { grid-template-columns: minmax(0, 1fr); }
      :root:not([data-native]) #tools_left,
      :root:not([data-native]) #tools_top,
      :root:not([data-native]) #tools_bottom,
      :root:not([data-native]) #cur_context_panel,
      :root:not([data-native]) #main_button,
      :root:not([data-native]) #title_panel,
      :root:not([data-native]) #sidepanels,
      :root:not([data-native]) #rulers {
        display: none !important;
      }
      :root:not([data-native]) #workarea {
        grid-area: workarea;
        min-width: 0;
        min-height: 0;
        border: 0;
        background: #f2f2f7;
      }
      #svgcanvas { background: transparent; }
      :root:not([data-native]):not([data-rulers]) #ruler_x, :root:not([data-native]):not([data-rulers]) #ruler_y, :root:not([data-native]):not([data-rulers]) #ruler_corner { display: none !important; }
      :root:not([data-native])[data-rulers] .svg_editor, :root:not([data-native])[data-rulers] .svg_editor.open { grid-template-rows: 15px minmax(0, 1fr); grid-template-columns: 15px minmax(0, 1fr); grid-template-areas: "corner rulerX" "rulerY workarea"; }
      :root[data-native] .svg_editor { font-family: "Google Sans Flex", "Noto Sans SC", sans-serif; font-size: 12px; --top-toolbar-min-height: 90px; }
      :root[data-native] #workarea { background: #eeebf3; border-color: #ded7e8; }
      :root[data-native] #tools_left, :root[data-native] #tools_top, :root[data-native] #tools_bottom, :root[data-native] #sidepanels { background: #faf9fc; }
      :root[data-native] #title_panel > p, :root[data-native] #sidepanel_handle, :root[data-native] #layersLabel, :root[data-native] #main_button { color: #493956; }
      :root[data-native] #layerbuttons { width: auto; height: auto; flex-wrap: wrap; justify-content: flex-start; }
      :root[data-native] #layerlist { width: 100%; }
      :root[data-native] #tools_bottom { border-top: 1px solid #ded7e8; }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <script src="./iife-Editor.js"></script>
    <script type="module" src="./figfox-bridge.js"></script>
  </body>
</html>
